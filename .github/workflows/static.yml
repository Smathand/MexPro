# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Write Supabase public config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_REDIRECT_TO: ${{ secrets.SUPABASE_REDIRECT_TO }}
        run: |
          python3 - << 'PY'
          import json, os
          from pathlib import Path
          # Only overwrite the committed config when both secrets are set,
          # so a missing secret can never blank out Supabase on the live site.
          if not (os.environ.get("SUPABASE_URL") and os.environ.get("SUPABASE_ANON_KEY")):
              print("SUPABASE_URL / SUPABASE_ANON_KEY secrets not set; keeping js/supabase-config.js from the repo")
              raise SystemExit(0)
          Path("js/supabase-config.js").write_text(
              "window.MEX_SUPABASE = "
              + json.dumps({
                  "url": os.environ.get("SUPABASE_URL", ""),
                  "anonKey": os.environ.get("SUPABASE_ANON_KEY", ""),
                  "redirectTo": os.environ.get("SUPABASE_REDIRECT_TO", ""),
              })
              + ";\n",
              encoding="utf-8",
          )
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

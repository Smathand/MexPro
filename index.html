  useEffect(() => {
    const handler = () => setAds(lsGet(K.GLOBAL_ADS, []));
    window.addEventListener('follows-changed', handler);
    return () => window.removeEventListener('follows-changed', handler);
  }, []);

  useEffect(() => {
    (async () => {
      const urls = {};
      for (const ad of ads) {
        if (ad.mediaKey) { try { urls[ad.mediaKey] = await getMediaUrl(ad.mediaKey); } catch (e) {} }
        if (ad.posterKey) { try { urls[ad.posterKey] = await getMediaUrl(ad.posterKey); } catch (e) {} }
      }
      setMediaUrls(urls);
    })();
  }, [ads]);

  const resetPostForm = () => {
    setForm({ title: '', content: '' });
    setMediaFile(null); setMediaType(null);
    if (previewUrlRef.current) { try { URL.revokeObjectURL(previewUrlRef.current); } catch (e) {} previewUrlRef.current = null; }
    setMediaPreview(''); setUploadProgress(''); setUploading(false);
    setPostFormKey(k => k + 1);
    if (fileRef.current) { try { fileRef.current.value = ''; } catch (e) {} }
  };

  const handleFile = async (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    if (previewUrlRef.current) { try { URL.revokeObjectURL(previewUrlRef.current); } catch (e) {} previewUrlRef.current = null; }
    if (f.type.indexOf('image/') === 0) {
      if (f.size > 20 * 1024 * 1024) { toast('Image max 20MB', 'error'); e.target.value = ''; return; }
      setMediaFile(f); setMediaType('image');
      const url = URL.createObjectURL(f); previewUrlRef.current = url; setMediaPreview(url);
    } else if (f.type.indexOf('video/') === 0) {
      if (f.size > 200 * 1024 * 1024) { toast('Video max 200MB', 'error'); e.target.value = ''; return; }
      setMediaFile(f); setMediaType('video');
      const url = URL.createObjectURL(f); previewUrlRef.current = url; setMediaPreview(url);
    } else toast('Unsupported format', 'error');
  };

  const post = async (e) => {
    e.preventDefault();
    if (!form.title.trim() || !form.content.trim()) return toast('Fill title and content', 'error');
    setUploading(true);
    setUploadProgress(mediaFile ? 'Saving media…' : 'Posting…');
    try {
      let mediaKey = null, mType = null;
      if (mediaFile && mediaType) {
        try { mediaKey = await saveMediaBlob(mediaFile, mediaType === 'video' ? 'advid_' : 'adimg_'); mType = mediaType; }
        catch (uploadErr) { toast('❌ Media save failed: ' + (uploadErr.message || 'unknown'), 'error'); setUploading(false); setUploadProgress(''); return; }
      }
      setUploadProgress('Saving post…');
      const tn = session.type === 'tenant' ? getTenant(session.tenantId) : null;
      const ad = {
        id: uid(), title: form.title.trim(), content: form.content.trim(),
        authorName: session.user.fullName || session.user.name || session.user.username,
        companyName: session.type === 'super' ? 'MeX Admin' : session.type === 'mex' ? (session.user.name || 'Member') : (tn ? tn.companyName : 'Company'),
        postedBy: session.type, posterId: session.type === 'mex' ? session.mexEmpId : (session.type === 'tenant' ? session.user.id : null),
        tenantId: session.type === 'tenant' ? session.tenantId : null,
        timestamp: Date.now(), likes: [], comments: [], views: 0, mediaKey, mediaType: mType, posterKey: null
      };
      const currentAds = lsGet(K.GLOBAL_ADS, []);
      const updated = currentAds.concat([ad]);
      lsSet(K.GLOBAL_ADS, updated);
      setAds(updated);
      resetPostForm();
      setOpen(false);
      refresh();
      toast('✅ Posted!', 'success');
    } catch (err) { toast('❌ ' + (err.message || 'Post failed'), 'error'); setUploading(false); setUploadProgress(''); }
  };

  const del = async (id) => {
    if (!confirm('Delete post?')) return;
    const ad = ads.find(a => a.id === id);
    if (ad) { if (ad.mediaKey) await deleteMediaKey(ad.mediaKey); if (ad.posterKey) await deleteMediaKey(ad.posterKey); }
    const updated = ads.filter(a => a.id !== id);
    lsSet(K.GLOBAL_ADS, updated);
    if (supabase) { try { await supabase.from('mex_posts').delete().eq('id', Number(id)); } catch (e) {} }
    setAds(updated); toast('Deleted', 'warning');
  };
  const like = (id) => { const all = lsGet(K.GLOBAL_ADS, []); const updated = all.map(a => { if (a.id !== id) return a; const likes = a.likes || []; const idx = likes.indexOf(myKey); return Object.assign({}, a, { likes: idx >= 0 ? likes.filter(l => l !== myKey) : likes.concat([myKey]) }); }); lsSet(K.GLOBAL_ADS, updated); setAds(updated); };
  const incrementView = (id) => { const all = lsGet(K.GLOBAL_ADS, []); const updated = all.map(a => a.id === id ? Object.assign({}, a, { views: (Number(a.views) || 0) + 30 }) : a); lsSet(K.GLOBAL_ADS, updated); setAds(updated); };
  const openComments = (ad) => { incrementView(ad.id); setCurrentAd(ad); setCommentText(''); setCommentsOpen(true); };
  const addComment = () => {
    if (!commentText.trim() || !currentAd) return;
    const newC = { id: uid(), userId: session.type === 'super' ? 0 : (session.type === 'mex' ? session.mexEmpId : session.user.id), userName: session.type === 'super' ? 'Super Admin' : (session.user.fullName || session.user.name || session.user.username), text: commentText.trim(), timestamp: Date.now() };
    const all = lsGet(K.GLOBAL_ADS, []);
    const updated = all.map(a => a.id === currentAd.id ? Object.assign({}, a, { comments: (a.comments || []).concat([newC]) }) : a);
    lsSet(K.GLOBAL_ADS, updated); setAds(updated);
    setCurrentAd(updated.find(a => a.id === currentAd.id));
    setCommentText(''); toast('✓ Comment added', 'success');
  };
  const promote = (ad) => { const c = prompt('1) 3d TSh 5,000  2) 7d TSh 10,000  3) 30d TSh 35,000\nEnter 1/2/3:'); let days = 0, price = 0; if (c === '1') { days = 3; price = 5000; } else if (c === '2') { days = 7; price = 10000; } else if (c === '3') { days = 30; price = 35000; } else return; if (!confirm('Promote ' + days + 'd for ' + fmtMoney(price) + '?')) return; const all = lsGet(K.GLOBAL_ADS, []); const updated = all.map(a => a.id === ad.id ? Object.assign({}, a, { promoted: true, promotedAt: Date.now(), promotedUntil: Date.now() + days * 86400000 }) : a); lsSet(K.GLOBAL_ADS, updated); setAds(updated); toast('🚀 Promoted', 'success'); };

  const onAuthorClick = (ad) => {
    if (ad.postedBy === 'super') setViewProfile({ userType: 'super', userId: 0, tenantId: null });
    else if (ad.postedBy === 'mex' && ad.posterId) setViewProfile({ userType: 'mex', userId: ad.posterId, tenantId: null });
    else if (ad.postedBy === 'tenant' && ad.tenantId) setViewProfile({ userType: 'tenant', userId: ad.posterId, tenantId: ad.tenantId });
  };

  const handleOpenChat = (type, uid_, tenantId_) => {
    setChatOpenWith({ type, userId: uid_, tenantId: tenantId_ });
    setViewProfile(null);
  };

  const sorted = ads.slice().sort((a, b) => { const aP = a.promoted && a.promotedUntil > Date.now(); const bP = b.promoted && b.promotedUntil > Date.now(); if (aP && !bP) return -1; if (!aP && bP) return 1; return b.timestamp - a.timestamp; });

  return (
    <div>
      {canPost ? (<div style={{ marginBottom: 16 }}><button className="btn btn-primary" onClick={() => { resetPostForm(); setOpen(true); }} style={{ width: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 10, padding: '14px 24px', fontSize: '1rem', fontWeight: 700, borderRadius: 14 }}><i className="fas fa-bullhorn" /> Post MexFace</button></div>) : null}
      {sorted.length === 0 ? <Card><div className="card-body"><div className="empty-state"><i className="fas fa-bullhorn" /><h3>No posts yet</h3></div></div></Card> : null}
      {sorted.map(ad => (<MexFacePostCard key={ad.id} ad={ad} mediaUrls={mediaUrls} myKey={myKey} session={session} onLike={like} onOpenComments={openComments} onDelete={del} onAuthorClick={onAuthorClick} onPromote={promote} />))}
      <Modal open={open} onClose={() => { if (uploading) { if (!confirm('Upload in progress. Cancel anyway?')) return; } resetPostForm(); setOpen(false); }} title="Post MexFace" icon="fas fa-bullhorn">
        <form key={postFormKey} onSubmit={post}>
          <Input label="Title" value={form.title} onChange={e => setForm(Object.assign({}, form, { title: e.target.value }))} required disabled={uploading} />
          <div className="form-group"><label>Content</label><textarea rows="4" value={form.content} onChange={e => setForm(Object.assign({}, form, { content: e.target.value }))} required disabled={uploading} /></div>
          <div className="form-group">
            <label>Media (image or video)</label>
            <input ref={fileRef} type="file" accept="image/*,video/*" onChange={handleFile} disabled={uploading} />
            {mediaPreview ? (<div className="media-preview">
              {mediaType === 'video' ? (<video src={mediaPreview} controls muted loop style={{ maxWidth: '100%', maxHeight: 240, borderRadius: 10 }} />) : (<img src={mediaPreview} alt="" />)}
              <div style={{ marginTop: 8 }}><Btn variant="danger" size="sm" type="button" onClick={() => { if (previewUrlRef.current) { try { URL.revokeObjectURL(previewUrlRef.current); } catch (e) {} previewUrlRef.current = null; } setMediaFile(null); setMediaType(null); setMediaPreview(''); if (fileRef.current) fileRef.current.value = ''; }} disabled={uploading}>Remove</Btn></div>
            </div>) : null}
            {uploading && uploadProgress ? <div style={{ marginTop: 8, fontSize: '.82rem', color: 'var(--accent-1)', fontWeight: 700 }}><i className="fas fa-spinner fa-spin" /> {uploadProgress}</div> : null}
          </div>
          <div className="form-actions">
            <Btn variant="secondary" type="button" onClick={() => { if (uploading) { if (!confirm('Upload in progress. Cancel anyway?')) return; } resetPostForm(); setOpen(false); }}>Cancel</Btn>
            <Btn type="submit" disabled={uploading}>{uploading ? 'Posting...' : 'Post'}</Btn>
          </div>
        </form>
      </Modal>
      <Modal open={commentsOpen} onClose={() => setCommentsOpen(false)} title={'Comments (' + ((currentAd && currentAd.comments) ? currentAd.comments.length : 0) + ')'} icon="fas fa-comments" maxWidth={560}>
        {currentAd ? (<div>
          <div style={{ maxHeight: 400, overflowY: 'auto', marginBottom: 14 }}>
            {(!currentAd.comments || currentAd.comments.length === 0) ? <div style={{ textAlign: 'center', padding: 30, color: 'var(--text-muted)' }}>No comments yet</div> : null}
            {(currentAd.comments || []).map(c => (<div key={c.id} style={{ display: 'flex', gap: 10, padding: '10px 0', borderBottom: '1px solid var(--border-color)' }}>
              <img src={avatarUrl(c.userName)} alt="" style={{ width: 34, height: 34, borderRadius: '50%', objectFit: 'cover', flexShrink: 0 }} />
              <div style={{ flex: 1, minWidth: 0 }}>
                <div><span style={{ fontWeight: 700, marginRight: 6 }}>{c.userName}</span><span style={{ color: 'var(--text-secondary)' }}>{c.text}</span></div>
                <div style={{ fontSize: '.72rem', color: 'var(--text-muted)', marginTop: 4 }}>{fmtRelative(c.timestamp)}</div>
              </div>
            </div>))}
          </div>
          <div style={{ display: 'flex', gap: 8 }}><input placeholder="Add a comment..." value={commentText} onChange={e => setCommentText(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); addComment(); } }} /><Btn onClick={addComment} disabled={!commentText.trim()}>Post</Btn></div>
        </div>) : null}
      </Modal>
      {viewProfile && (<UserProfileViewModal userType={viewProfile.userType} userId={viewProfile.userId} tenantId={viewProfile.tenantId} session={session} onClose={() => setViewProfile(null)} onOpenChat={handleOpenChat} />)}
      {chatOpenWith ? <ChatModal open={true} onClose={() => setChatOpenWith(null)} session={session} initialContact={chatOpenWith} /> : null}
    </div>
  );
}

/* Chat */
function ChatModal({ open, onClose, session, initialContact }) {
  const [messages, setMessages] = useState([]);
  const [contacts, setContacts] = useState([]);
  const [selected, setSelected] = useState(null);
  const [text, setText] = useState('');
  const meId = session.type === 'super' ? 'super' : session.type === 'mex' ? 'mex_' + session.mexEmpId : 'tenant_' + session.tenantId + '_' + session.user.id;
  useEffect(() => {
    if (!open) return;
    setMessages(lsGet(K.CHAT, []));
    const list = [];
    if (session.type === 'super') {
      getAllTenants().forEach(t => { const users = getTenantData(t.id, 'users', []); const owner = users.find(u => u.role === 'owner'); if (owner) list.push({ id: 'tenant_' + t.id + '_' + owner.id, name: owner.fullName || t.companyName, sub: 'Owner' }); });
      // Also mex employees
      lsGet(K.MEX_EMPLOYEES, []).forEach(e => list.push({ id: 'mex_' + e.id, name: e.name, sub: 'Member' }));
    } else if (session.type === 'mex') {
      list.push({ id: 'super', name: 'MeX Support', sub: 'Super Admin' });
    } else {
      list.push({ id: 'super', name: 'MeX Support', sub: 'Super Admin' });
      const users = getTenantData(session.tenantId, 'users', []);
      users.forEach(u => { if (u.id !== session.user.id) list.push({ id: 'tenant_' + session.tenantId + '_' + u.id, name: u.fullName || u.username, sub: u.role }); });
    }
    setContacts(list);
    // Auto-select initial contact
    if (initialContact) {
      const targetId = initialContact.type === 'super' ? 'super' : initialContact.type === 'mex' ? 'mex_' + initialContact.userId : 'tenant_' + initialContact.tenantId + '_' + initialContact.userId;
      const existing = list.find(c => c.id === targetId);
      if (existing) setSelected(existing.id);
      else {
        // Add missing contact
        const info = resolveUserInfoByKey(targetId);
        if (info) {
          const newC = { id: targetId, name: info.name, sub: info.role };
          list.push(newC); setContacts(list.slice()); setSelected(targetId);
        }
      }
    }
  }, [open, session, initialContact]);
  const send = () => { if (!text.trim() || !selected) return; const msg = { id: uid(), from: meId, to: selected, text: text.trim(), timestamp: Date.now() }; const updated = messages.concat([msg]); lsSet(K.CHAT, updated); setMessages(updated); setText(''); };
  const filtered = selected ? messages.filter(m => (m.from === meId && m.to === selected) || (m.from === selected && m.to === meId)) : [];
  if (!open) return null;
  return (
    <Modal open={open} onClose={onClose} title="Chat" icon="fas fa-comments" maxWidth={720}>
      <div style={{ display: 'flex', height: 400, gap: 12 }}>
        <div style={{ width: 200, overflowY: 'auto', borderRight: '1px solid var(--border-color)', flexShrink: 0 }}>
          {contacts.map(c => (<div key={c.id} className={'contact-item ' + (selected === c.id ? 'active' : '')} onClick={() => setSelected(c.id)}><div className="contact-avatar"><img src={avatarUrl(c.name)} alt="" /></div><div><div className="contact-name">{c.name}</div><div className="contact-sub">{c.sub}</div></div></div>))}
        </div>
        <div style={{ flex: 1, display: 'flex', flexDirection: 'column' }}>
          <div style={{ flex: 1, overflowY: 'auto', background: '#efeae2', padding: 12, borderRadius: 8 }}>
            {filtered.length === 0 ? <div style={{ textAlign: 'center', padding: 30, color: 'var(--text-muted)' }}>{selected ? 'No messages' : 'Select a contact'}</div> : null}
            {filtered.map(m => (<div key={m.id} className={'chat-msg ' + (m.from === meId ? 'me' : 'them')}>{m.text}</div>))}
          </div>
          <div style={{ display: 'flex', gap: 8, marginTop: 8 }}><input value={text} onChange={e => setText(e.target.value)} placeholder="Type..." onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); send(); } }} /><Btn onClick={send}>Send</Btn></div>
        </div>
      </div>
    </Modal>
  );
}

/* Low Stock */
function LowStockModal({ open, onClose, session }) {
  const tid = session.tenantId;
  const isB = session.type === 'tenant' && session.user.role === 'employee' && session.user.store;
  const [products, setProducts] = useState([]);
  const [qtyMap, setQtyMap] = useState({});
  const toast = useToast();
  const { refresh } = useApp();
  useEffect(() => {
    if (!open) return;
    const all = getTenantData(tid, 'products', []).filter(p => !isB || p.store === session.user.store);
    setProducts(all.filter(p => Number(p.quantity) <= LOW_STOCK_THRESHOLD).sort((a, b) => a.quantity - b.quantity));
    setQtyMap({});
  }, [open, tid, isB, session.user.store]);
  const addStock = (product, amount) => {
    const n = Math.max(1, Number(amount) || 0);
    const all = getTenantData(tid, 'products', []);
    const updated = all.map(p => Number(p.id) === Number(product.id) ? Object.assign({}, p, { quantity: (Number(p.quantity) || 0) + n }) : p);
    setTenantData(tid, 'products', updated);
    toast(`✅ +${n} added to "${product.name}"`, 'success');
    const refreshed = updated.filter(p => !isB || p.store === session.user.store).filter(p => Number(p.quantity) <= LOW_STOCK_THRESHOLD).sort((a, b) => a.quantity - b.quantity);
    setProducts(refreshed);
    setQtyMap(Object.assign({}, qtyMap, { [product.id]: '' }));
    refresh();
  };
  return (
    <Modal open={open} onClose={onClose} title={'Low Stock (' + products.length + ')'} icon="fas fa-exclamation-triangle" maxWidth={620}>
      {products.length === 0 ? <div style={{ textAlign: 'center', padding: 30, color: 'var(--text-muted)' }}><i className="fas fa-check-circle" style={{ fontSize: '2rem', color: 'var(--accent-4)', marginBottom: 10, display: 'block' }} />All products above threshold ✓</div> : null}
      {products.map(p => { const qty = qtyMap[p.id] || ''; return (
        <div key={p.id} className="add-stock-row">
          <div className="add-stock-info"><div className="add-stock-name">{p.name}</div><div className="add-stock-meta">{p.store} · Current: <span className="add-stock-qty">{p.quantity}</span> / Threshold: {LOW_STOCK_THRESHOLD}</div></div>
          <div className="add-stock-controls"><input type="number" min="1" className="add-stock-input" placeholder="Qty" value={qty} onChange={e => setQtyMap(Object.assign({}, qtyMap, { [p.id]: e.target.value }))} onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); addStock(p, qty); } }} /><Btn variant="success" size="sm" icon="fas fa-plus" onClick={() => addStock(p, qty || 10)}>Add</Btn></div>
          <div className="quick-add-btns" style={{ width: '100%' }}>{[10, 25, 50, 100].map(n => (<button key={n} type="button" className="quick-add-btn" onClick={() => addStock(p, n)}>+{n}</button>))}</div>
        </div>
      ); })}
      <div className="form-actions" style={{ marginTop: 20 }}><Btn variant="secondary" onClick={onClose}>Close</Btn></div>
    </Modal>
  );
}

/* Profile */
function ProfileModal({ open, onClose, session, refresh, refreshSession }) {
  const toast = useToast();
  const [form, setForm] = useState({ fullName: '', email: '', phone: '', bio: '', newPassword: '', confirm: '', socialWhatsapp: '', socialInstagram: '', socialFacebook: '', socialTiktok: '', socialWebsite: '' });
  const [photoFile, setPhotoFile] = useState(null); const [photoPreview, setPhotoPreview] = useState(''); const [uploading, setUploading] = useState(false);
  const fileRef = useRef();
  useEffect(() => {
    if (!open || !session || !session.user) return;
    setForm({ fullName: session.user.fullName || session.user.name || '', email: session.user.email || '', phone: session.user.phone || '', bio: session.user.bio || '', newPassword: '', confirm: '', socialWhatsapp: session.user.socialWhatsapp || '', socialInstagram: session.user.socialInstagram || '', socialFacebook: session.user.socialFacebook || '', socialTiktok: session.user.socialTiktok || '', socialWebsite: session.user.socialWebsite || '' });
    setPhotoFile(null); setPhotoPreview(getAvatarSrc(session.user));
  }, [open, session]);
  const handlePhoto = (e) => { const f = e.target.files?.[0]; if (!f) return; if (f.size > 10 * 1024 * 1024) return toast('Max 10MB', 'error'); setPhotoFile(f); setPhotoPreview(URL.createObjectURL(f)); };
  const save = async (e) => {
    e.preventDefault();
    if (form.newPassword && form.newPassword !== form.confirm) return toast('Passwords do not match', 'error');
    if (form.newPassword && form.newPassword.length < 4) return toast('Password too short', 'error');
    setUploading(true);
    try {
      let newPhotoKey = null;
      if (photoFile) { newPhotoKey = await saveMediaBlob(photoFile, 'avatar_'); }
      const socials = { socialWhatsapp: form.socialWhatsapp, socialInstagram: form.socialInstagram, socialFacebook: form.socialFacebook, socialTiktok: form.socialTiktok, socialWebsite: form.socialWebsite };
      if (session.type === 'super') { const su = lsGet(K.SUPER_USER, {}) || {}; su.fullName = form.fullName; su.email = form.email; su.phone = form.phone; su.bio = form.bio; if (newPhotoKey) su.photoKey = newPhotoKey; Object.assign(su, socials); lsSet(K.SUPER_USER, su); }
      else if (session.type === 'mex') { const emps = lsGet(K.MEX_EMPLOYEES, []); const i = emps.findIndex(e => Number(e.id) === Number(session.mexEmpId)); if (i >= 0) { emps[i].name = form.fullName || emps[i].name; emps[i].email = form.email; emps[i].phone = form.phone; emps[i].bio = form.bio; if (newPhotoKey) emps[i].photoKey = newPhotoKey; if (form.newPassword) { emps[i].password = hashPw(emps[i].username, form.newPassword); emps[i].plainPassword = form.newPassword; } Object.assign(emps[i], socials); lsSet(K.MEX_EMPLOYEES, emps); } }
      else if (session.type === 'tenant') { const users = getTenantData(session.tenantId, 'users', []); const i = users.findIndex(u => Number(u.id) === Number(session.user.id)); if (i >= 0) { users[i].fullName = form.fullName || users[i].fullName; users[i].email = form.email; users[i].phone = form.phone; users[i].bio = form.bio; if (newPhotoKey) users[i].photoKey = newPhotoKey; if (form.newPassword) { users[i].password = hashPw(users[i].username, form.newPassword); users[i].plainPassword = form.newPassword; } Object.assign(users[i], socials); lsSet(`sb_tenant_${session.tenantId}_users`, users); } }
      toast('✓ Saved', 'success');
      if (refreshSession) refreshSession();
      if (refresh) refresh();
      onClose();
    } catch (err) { toast('❌ ' + err.message, 'error'); }
    finally { setUploading(false); }
  };
  if (!session || !session.user) return null;
  return (
    <Modal open={open} onClose={onClose} title="My Profile" icon="fas fa-user-cog">
      <form onSubmit={save}>
        <div className="profile-photo-wrap"><img className="profile-preview" src={photoPreview || avatarUrl('User')} alt="" data-avatar-key={session.user.photoKey || ''} /><label className="profile-camera-btn" title="Change photo"><i className="fas fa-camera" /><input ref={fileRef} type="file" accept="image/*" onChange={handlePhoto} style={{ display: 'none' }} /></label></div>
        <Input label="Full Name" value={form.fullName} onChange={e => setForm(Object.assign({}, form, { fullName: e.target.value }))} />
        <div className="form-row"><Input label="Email" type="email" value={form.email} onChange={e => setForm(Object.assign({}, form, { email: e.target.value }))} /><Input label="Phone" value={form.phone} onChange={e => setForm(Object.assign({}, form, { phone: e.target.value }))} /></div>
        <div className="form-group"><label>Bio</label><textarea rows="3" value={form.bio} onChange={e => setForm(Object.assign({}, form, { bio: e.target.value }))} maxLength={300} /><div className="bio-counter">{form.bio.length} / 300</div></div>
        <div className="social-header"><i className="fas fa-share-alt" /> Social Media</div>
        {SOCIAL_FIELDS.map(f => (<div key={f.key} className="form-group"><label style={{ display: 'flex', alignItems: 'center', gap: 6 }}><i className={f.icon} /> {f.label}</label><input value={form[f.key] || ''} onChange={e => setForm(Object.assign({}, form, { [f.key]: e.target.value }))} placeholder={f.ph} /></div>))}
        <div className="form-row"><Input label="New Password" type="password" value={form.newPassword} onChange={e => setForm(Object.assign({}, form, { newPassword: e.target.value }))} placeholder="(optional)" /><Input label="Confirm" type="password" value={form.confirm} onChange={e => setForm(Object.assign({}, form, { confirm: e.target.value }))} /></div>
        <div className="form-actions"><Btn variant="secondary" type="button" onClick={onClose} disabled={uploading}>Cancel</Btn><Btn type="submit" disabled={uploading}>{uploading ? 'Saving...' : 'Save'}</Btn></div>
      </form>
    </Modal>
  );
}

/* App Shell */
const NAV = [
  { view: 'status', icon: 'fas fa-bullhorn', label: 'MexFace' },
  { view: 'dashboard', icon: 'fas fa-chart-pie', label: 'MexData' },
  { view: 'sales', icon: 'fas fa-cart-plus', label: 'Sales' },
  { view: 'debts', icon: 'fas fa-hand-holding-usd', label: 'Debts' },
  { view: 'inventory', icon: 'fas fa-boxes', label: 'Inventory' },
  { view: 'pnl', icon: 'fas fa-scale-balanced', label: 'Profit & Loss' },
  { view: 'expenses', icon: 'fas fa-receipt', label: 'Expenses' },
  { view: 'branches', icon: 'fas fa-store', label: 'Branches' },
  { view: 'users', icon: 'fas fa-users-cog', label: 'Users' },
  { view: 'roles', icon: 'fas fa-user-tag', label: 'Roles' },
  { view: 'reports', icon: 'fas fa-file-alt', label: 'Reports' },
  { view: 'attendance', icon: 'fas fa-clock', label: 'Attendance' },
  { view: 'superadmin', icon: 'fas fa-crown', label: 'Super Admin' },
  { view: 'mex-earnings', icon: 'fas fa-coins', label: 'My Earnings' },
  { view: 'mex-companies', icon: 'fas fa-building', label: 'My Companies' },
];
const BRANCH_HIDDEN = ['branches', 'users', 'roles', 'attendance'];

function AppShell() {
  const { session, view, setView, theme, toggleTheme, logout, refresh, refreshSession } = useApp();
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [lowStockOpen, setLowStockOpen] = useState(false);
  const [chatOpen, setChatOpen] = useState(false);
  const [profileOpen, setProfileOpen] = useState(false);
  const isSuper = session.type === 'super';
  const isMex = session.type === 'mex';
  const isBranch = session.type === 'tenant' && session.user.role === 'employee' && !!session.user.store;
  const visibleNav = NAV.filter(n => {
    if (isSuper) return n.view === 'status' || n.view === 'superadmin';
    if (isMex) return n.view === 'mex-earnings' || n.view === 'mex-companies' || n.view === 'status';
    if (isBranch) return BRANCH_HIDDEN.indexOf(n.view) === -1 && n.view !== 'superadmin' && n.view !== 'mex-earnings' && n.view !== 'mex-companies';
    return n.view !== 'superadmin' && n.view !== 'mex-earnings' && n.view !== 'mex-companies';
  });
  const lowStockCount = useMemo(() => {
    if (isSuper || isMex) return 0;
    const tid = session.tenantId; const isB = isBranch;
    const products = getTenantData(tid, 'products', []).filter(p => !isB || p.store === session.user.store);
    return products.filter(p => Number(p.quantity) <= LOW_STOCK_THRESHOLD).length;
  }, [session, view, refresh]);
  const tn = session.type === 'tenant' ? getTenant(session.tenantId) : null;
  const companyName = isSuper ? 'MeX Admin' : isMex ? 'MeX Team' : (tn ? tn.companyName : 'MeX');
  const userName = session.user.fullName || session.user.name || session.user.username || 'User';
  const userRole = session.user.role || (isSuper ? 'Super Admin' : 'Member');
  const pt = NAV.find(n => n.view === view);
  const pageTitle = pt ? pt.label : 'MexFace';

  const renderPage = () => {
    switch (view) {
      case 'dashboard': return <DashboardPage />;
      case 'sales': return <SalesPage />;
      case 'debts': return <DebtsPage />;
      case 'inventory': return <InventoryPage />;
      case 'expenses': return <ExpensesPage />;
      case 'pnl': return <PnlPage />;
      case 'branches': return session.user.role === 'owner' ? <BranchesPage /> : <Card><div className="card-body">🔒 Owner only</div></Card>;
      case 'users': return <UsersPage />;
      case 'roles': return <RolesPage />;
      case 'reports': return <ReportsPage />;
      case 'attendance': return <AttendancePage />;
      case 'superadmin': return isSuper ? <SuperAdminPage /> : <Card><div className="card-body">🔒 Super Admin only</div></Card>;
      case 'mex-earnings': return isMex ? <MexEarningsPage /> : <Card><div className="card-body">🔒 Member only</div></Card>;
      case 'mex-companies': return isMex ? <MexCompaniesPage /> : <Card><div className="card-body">🔒 Member only</div></Card>;
      case 'status': return <StatusPage />;
      default: return <DashboardPage />;
    }
  };

  return (
    <div className="app-container">
      <div className={'sidebar ' + (sidebarOpen ? 'open' : '')}>
        <div className="sidebar-brand">
          <div className="brand-icon"><i className="fas fa-bolt" /></div>
          <span className="brand-text">{companyName}</span>
          <span className="brand-ver">PRO</span>
        </div>
        <nav className="sidebar-nav">
          {visibleNav.map(n => (<button key={n.view} className={'nav-item ' + (view === n.view ? 'active' : '')} onClick={() => { setView(n.view); setSidebarOpen(false); }}><i className={n.icon} /><span>{n.label}</span>{n.view === 'inventory' && lowStockCount > 0 ? <span className="badge">{lowStockCount}</span> : null}</button>))}
        </nav>
        <div className="sidebar-footer">
          <img className="user-avatar" src={getAvatarSrc(session.user)} alt="" data-avatar-key={session.user.photoKey || ''} />
          <div className="user-info"><div className="name">{userName}</div><div className="role">{getRoleLabel(userRole)}</div></div>
          <button className="logout-btn" onClick={logout} title="Logout"><i className="fas fa-sign-out-alt" /></button>
        </div>
      </div>
      <div className="main-content">
        <header className="topbar">
          <button className="mobile-menu-btn" onClick={() => setSidebarOpen(!sidebarOpen)}><i className="fas fa-bars" /></button>
          <div className="page-title">{pageTitle}</div>
          <div className="topbar-actions">
            <span className="date-display"><i className="far fa-calendar-alt" /><span>{getTzNowDate()}</span></span>
            {!isSuper && !isMex ? (<button className={'low-stock-alert-btn ' + (lowStockCount > 0 ? 'has-alert' : '')} onClick={() => setLowStockOpen(true)}><i className="fas fa-exclamation-triangle" /><span>Low Stock</span><span className="alert-count">{lowStockCount}</span></button>) : null}
            <button className="icon-btn" onClick={toggleTheme} title="Theme"><i className={theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon'} /></button>
            <button className="icon-btn" onClick={() => setChatOpen(true)} title="Chat"><i className="fas fa-comments" /></button>
            <button className="icon-btn" onClick={() => setProfileOpen(true)} title="Profile" style={{ padding: 0 }}><img src={getAvatarSrc(session.user)} alt="" data-avatar-key={session.user.photoKey || ''} style={{ width: '100%', height: '100%', objectFit: 'cover' }} /></button>
          </div>
        </header>
        <div className="content-area">{renderPage()}</div>
      </div>
      <LowStockModal open={lowStockOpen} onClose={() => { setLowStockOpen(false); refresh(); }} session={session} />
      <ChatModal open={chatOpen} onClose={() => setChatOpen(false)} session={session} />
      <ProfileModal open={profileOpen} onClose={() => setProfileOpen(false)} session={session} refresh={refresh} refreshSession={refreshSession} />
    </div>
  );
}

function LoadingScreenComponent() {
  const [progress, setProgress] = useState(0);
  useEffect(() => {
    const id = setInterval(() => { setProgress(p => (p >= 100 ? 100 : p + Math.random() * 12)); }, 150);
    return () => clearInterval(id);
  }, []);
  return (
    <div className="loading-screen">
      <div className="loader-bg-grid"></div>
      <div className="loader-glow"></div>
      <div className="loader-content">
        <div className="mex-logo-loader"><span className="m">M</span><span className="e">E</span><span className="x">X</span></div>
        <div className="loader-title">MeX PRO</div>
        <div className="loader-bar"><div className="loader-bar-fill" style={{ width: Math.min(progress, 100) + '%' }}></div></div>
      </div>
    </div>
  );
}

function App() {
  const { session, booting } = useApp();
  if (booting) return <LoadingScreenComponent />;
  if (!session) return <LoginPage />;
  return <AppShell />;
}

class ErrorBoundary extends React.Component {
  constructor(p) { super(p); this.state = { err: null }; }
  componentDidCatch(err, info) { console.error(err, info); this.setState({ err }); }
  render() {
    if (this.state.err) return (<div className="error-screen"><h1>⚠ Error</h1><p><strong>{this.state.err.message}</strong></p><pre>{this.state.err.stack}</pre><button onClick={() => location.reload()} style={{ padding: 10, background: '#128C7E', color: '#fff', border: 'none', borderRadius: 8, cursor: 'pointer', fontWeight: 600 }}>Reload</button></div>);
    return this.props.children;
  }
}

const rootEl = document.getElementById('root');
rootEl.innerHTML = '';
ReactDOM.createRoot(rootEl).render(
  <ErrorBoundary>
    <ToastProvider>
      <AppProvider>
        <App />
      </AppProvider>
    </ToastProvider>
  </ErrorBoundary>
);
console.log('✅ MeX PRO React loaded');
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<title>MeX PRO</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{--bg-body:#f0f4f8;--bg-card:#fff;--bg-sidebar:#128C7E;--bg-sidebar-hover:#0e6b5f;--bg-sidebar-active:#0a554b;--text-primary:#0f172a;--text-secondary:#334155;--text-muted:#64748b;--text-sidebar:#e0f0ee;--accent-1:#128C7E;--accent-2:#0e6b5f;--accent-3:#f59e0b;--accent-4:#10b981;--accent-danger:#ef4444;--verified-blue:#0095F6;--shadow-card:0 4px 20px rgba(0,0,0,.06);--radius-card:20px;--radius-sm:12px;--border-color:rgba(0,0,0,.06);--input-bg:#f8fafc;--input-border:#e2e8f0;--font:'Inter','Segoe UI',sans-serif;--whatsapp-color:#25D366;--email-color:#3b82f6}
body.dark{--bg-body:#0a0a0a;--bg-card:#1a1a1a;--bg-sidebar:#0a554b;--text-primary:#e8e8f0;--text-secondary:#b0b0c8;--text-muted:#70708a;--text-sidebar:#b8d9d4;--border-color:rgba(255,255,255,.08);--input-bg:#1f1f1f;--input-border:#2a2a2a}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;height:100dvh;overflow:hidden;overscroll-behavior:none;scrollbar-width:none}
::-webkit-scrollbar{display:none}
body{font-family:var(--font);background:var(--bg-body);color:var(--text-primary);transition:background .3s,color .3s;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
#root{height:100%;height:100dvh;overflow:hidden}
button,.btn{outline:none!important;box-shadow:none!important;border:none!important;border-radius:12px!important;cursor:pointer;font-family:var(--font);font-weight:600;transition:background .15s}
.btn-primary{background:var(--accent-1)!important;color:#fff!important;padding:10px 20px}
.btn-secondary{background:var(--input-bg)!important;color:var(--text-secondary)!important;border:1px solid var(--border-color)!important;padding:10px 20px}
.btn-success{background:var(--accent-4)!important;color:#fff!important;padding:10px 20px}
.btn-danger{background:var(--accent-danger)!important;color:#fff!important;padding:10px 20px}
.btn-whatsapp{background:var(--whatsapp-color)!important;color:#fff!important;padding:10px 20px}
.btn-email{background:var(--email-color)!important;color:#fff!important;padding:10px 20px}
.btn-purple{background:#8b5cf6!important;color:#fff!important;padding:10px 20px}
.btn-gold{background:linear-gradient(135deg,#f59e0b,#d97706)!important;color:#fff!important;padding:10px 20px}
.btn-sm{padding:6px 14px!important;font-size:.8rem!important;border-radius:8px!important}
.btn-xs{padding:3px 10px!important;font-size:.7rem!important;border-radius:6px!important}
.btn-icon{display:inline-flex;align-items:center;gap:8px}
.btn-block{width:100%;display:block;text-align:center}
.card{background:var(--bg-card);border-radius:var(--radius-card);border:1px solid var(--border-color);box-shadow:var(--shadow-card);overflow:hidden}
.card-header{padding:16px 24px;border-bottom:1px solid var(--border-color);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.card-header h3{font-size:1.05rem;font-weight:700;display:flex;align-items:center;gap:10px}
.card-body{padding:20px 24px}
input,select,textarea{width:100%;padding:12px 16px;border-radius:var(--radius-sm);border:1px solid var(--input-border);background:var(--input-bg);color:var(--text-primary);font-size:16px;font-family:var(--font);outline:none;transition:.2s;font-weight:500}
input:focus,select:focus,textarea:focus{border-color:var(--accent-1);box-shadow:0 0 0 3px rgba(18,140,126,.15);background:var(--bg-card)}
label{display:block;font-size:.78rem;font-weight:600;color:var(--text-secondary);margin-bottom:6px;text-transform:uppercase}
.form-group{margin-bottom:14px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.badge{display:inline-block;padding:3px 12px;border-radius:20px;font-size:.7rem;font-weight:700}
.badge-success{background:rgba(16,185,129,.12);color:var(--accent-4)}
.badge-danger{background:rgba(239,68,68,.12);color:var(--accent-danger)}
.badge-warning{background:rgba(245,158,11,.12);color:var(--accent-3)}
.badge-info{background:rgba(18,140,126,.08);color:var(--accent-1)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{text-align:left;padding:12px 12px 12px 0;color:var(--text-muted);font-weight:700;font-size:.68rem;text-transform:uppercase;border-bottom:1px solid var(--border-color);white-space:nowrap}
td{padding:14px 12px 14px 0;border-bottom:1px solid var(--border-color);color:var(--text-secondary);vertical-align:middle;font-weight:500}
.empty-row td{text-align:center;padding:40px;color:var(--text-muted)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pageCardIn{from{opacity:0;transform:translateY(30px) scale(.94)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes slideInRight{from{opacity:0;transform:translateX(50px)}to{opacity:1;transform:translateX(0)}}
.page-overlay{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg-body);padding:20px;overflow-y:auto;overscroll-behavior:contain;animation:fadeIn .35s ease}
.page-card{margin:20px auto;max-height:92vh;overflow-y:auto;padding:26px 24px;width:100%;max-width:420px;background:var(--bg-card);border-radius:var(--radius-card);box-shadow:0 8px 30px rgba(0,0,0,.1);border:1px solid var(--border-color);text-align:center;animation:pageCardIn .6s cubic-bezier(.34,1.56,.64,1) backwards}
.page-card .logo-icon{font-size:44px;color:var(--accent-1);margin-bottom:4px;animation:pageCardIn .5s cubic-bezier(.34,1.56,.64,1) .1s backwards}
.page-card h2{font-size:1.5rem;font-weight:800;color:var(--accent-1);animation:pageCardIn .5s cubic-bezier(.34,1.56,.64,1) .15s backwards}
.page-card .subtitle{color:var(--text-muted);margin-bottom:16px;font-size:.85rem;animation:fadeIn .6s ease .25s backwards}
.page-card .input-group{text-align:left;margin-bottom:12px;animation:pageCardIn .5s cubic-bezier(.34,1.56,.64,1) .2s backwards}
.page-card button[type=submit]{animation:pageCardIn .5s cubic-bezier(.34,1.56,.64,1) .3s backwards}
.error-msg{color:var(--accent-danger);font-size:.85rem;margin-top:8px;font-weight:600}
.success-msg{color:var(--accent-4);font-size:.85rem;margin-top:8px;font-weight:600}
.divider{margin:14px 0 10px;border-top:1px solid var(--border-color)}
.link-text{color:var(--accent-1);font-weight:700;cursor:pointer}
.app-container{display:flex;height:100%;height:100dvh;overflow:hidden;padding:12px;gap:12px;background:var(--bg-body)}
.sidebar{width:240px;min-width:240px;background:linear-gradient(180deg,var(--bg-sidebar),var(--accent-2));display:flex;flex-direction:column;padding:20px 12px;height:100%;overflow-y:auto;border-radius:16px;box-shadow:var(--shadow-card);overscroll-behavior:contain}
.sidebar-brand{display:flex;align-items:center;gap:12px;padding:0 8px 14px;border-bottom:1px solid rgba(255,255,255,.15);margin-bottom:12px;flex-wrap:wrap}
.brand-icon{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:1.2rem;font-weight:800;color:#fff}
.brand-text{font-size:1.05rem;font-weight:800;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:120px}
.brand-ver{font-size:.55rem;font-weight:800;color:#fff;background:linear-gradient(135deg,#f59e0b,#d97706);padding:3px 10px;border-radius:20px;margin-left:auto}
.sidebar-nav{flex:1;display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:14px;padding:11px 14px;border-radius:var(--radius-sm);color:var(--text-sidebar);font-weight:600;font-size:.85rem;cursor:pointer;background:transparent;width:100%;text-align:left;min-height:44px}
.nav-item i{width:20px;font-size:1rem}
.nav-item:hover{background:var(--bg-sidebar-hover);color:#fff}
.nav-item.active{background:var(--bg-sidebar-active);color:#fff}
.nav-item .badge{margin-left:auto;background:rgba(255,255,255,.2);color:#fff;font-size:.6rem;padding:2px 8px;border-radius:20px}
.sidebar-footer{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.15);display:flex;align-items:center;gap:12px}
.user-avatar{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.2);display:block;flex-shrink:0;object-fit:cover}
.user-info{flex:1;line-height:1.25;min-width:0}
.user-info .name{font-weight:700;font-size:.8rem;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-info .role{font-size:.6rem;color:rgba(255,255,255,.7);text-transform:uppercase;font-weight:600}
.logout-btn{background:rgba(255,255,255,.08);color:rgba(255,255,255,.6);width:36px;height:36px;border-radius:50%!important;display:flex;align-items:center;justify-content:center}
.logout-btn:hover{background:rgba(255,255,255,.2);color:#fff}
.main-content{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg-body);border-radius:16px;box-shadow:var(--shadow-card);min-width:0;min-height:0;height:100%}
.topbar{padding:0 20px;background:var(--bg-card);border-bottom:1px solid var(--border-color);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;flex-wrap:nowrap;gap:10px;position:relative;z-index:100;height:68px;min-height:68px;overflow:hidden}
.topbar .page-title{font-size:1.1rem;font-weight:800;flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px;margin:0}
.topbar-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:nowrap}
.date-display{font-size:.82rem;color:var(--text-muted);background:var(--input-bg);padding:9px 16px;border-radius:22px;border:1px solid var(--border-color);font-weight:600;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.icon-btn{background:var(--input-bg);border:1px solid var(--border-color)!important;border-radius:50%!important;width:44px;height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-secondary);font-size:1.05rem;flex-shrink:0;position:relative;text-decoration:none;padding:0;overflow:hidden}
.icon-btn:hover{background:var(--accent-1);color:#fff}
.low-stock-alert-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:12px!important;font-weight:700;font-size:.85rem;background:var(--accent-1)!important;color:#fff!important;white-space:nowrap;flex-shrink:0;min-width:120px;justify-content:center}
.low-stock-alert-btn.has-alert{background:var(--accent-danger)!important}
.low-stock-alert-btn .alert-count{background:rgba(255,255,255,.28);border-radius:20px;padding:2px 10px;font-size:.72rem;font-weight:800;min-width:22px;text-align:center}
.content-area{flex:1;overflow-y:auto;padding:24px 28px 32px;overscroll-behavior:contain;min-height:0;-webkit-overflow-scrolling:touch}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:18px}
.stat-card{background:var(--bg-card);border-radius:16px;padding:12px 16px;border:1px solid var(--border-color);box-shadow:var(--shadow-card);position:relative;overflow:hidden;min-height:66px;display:flex;flex-direction:column;justify-content:center}
.stat-card::after{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--accent-1),var(--accent-3));opacity:.85}
.stat-label{font-size:.62rem;text-transform:uppercase;font-weight:700;color:var(--text-muted)}
.stat-value{font-size:clamp(.92rem,1vw + .68rem,1.3rem);font-weight:800;white-space:nowrap;margin-top:2px}
.stat-value.primary{color:var(--accent-1)}
.stat-value.primary-light{color:#1a9b8c}
.stat-value.primary-dark{color:#0e6b5f}
.stat-value.red{color:var(--accent-danger)}
.stat-value.gold{color:var(--accent-3)}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:12px}
.section-header h2{font-size:1.05rem;font-weight:800}
.section-header h2 i{color:var(--accent-1)}
.modal-overlay{position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .2s}
.modal-box{background:var(--bg-card);border-radius:var(--radius-card);padding:20px 32px 28px;max-width:600px;width:100%;max-height:90vh;overflow-y:auto;border:1px solid var(--border-color);box-shadow:0 20px 60px rgba(0,0,0,.2);overscroll-behavior:contain;position:relative}
.modal-close-btn{position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:50%!important;background:rgba(0,0,0,.06);color:var(--text-secondary);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1rem;z-index:100;transition:all .15s;padding:0}
.modal-close-btn:hover{background:rgba(239,68,68,.15);color:var(--accent-danger);transform:scale(1.05)}
body.dark .modal-close-btn{background:rgba(255,255,255,.08)}
body.dark .modal-close-btn:hover{background:rgba(239,68,68,.25);color:#fca5a5}
.modal-box h3{font-size:1.15rem;font-weight:800;margin-bottom:20px;padding-right:48px;display:flex;align-items:center;gap:10px;line-height:1.3;min-height:28px}
.form-actions{display:flex;gap:12px;margin-top:20px;justify-content:flex-end;flex-wrap:wrap}
.chart-container{position:relative;height:240px;width:100%;padding:0;margin:0;overflow:hidden}
.chart-container canvas{display:block!important;width:100%!important;height:100%!important;margin:0!important;padding:0!important}
.chart-grid{display:grid;grid-template-columns:2fr 1fr;gap:20px;margin-bottom:24px}
.chart-grid .card-body{padding:8px 16px 16px}
.chart-grid .card-header{padding:14px 16px}
.inventory-search-wrap{position:relative;margin-bottom:16px;display:flex;align-items:center}
.inventory-search-icon{position:absolute;left:16px;color:var(--text-muted);pointer-events:none;z-index:2}
.inventory-search-input{padding-left:42px!important;border-radius:30px!important;height:48px}
.empty-state{text-align:center;padding:40px 20px;color:var(--text-muted)}
.empty-state i{font-size:3rem;opacity:.3;margin-bottom:12px;display:block}
.empty-state h3{font-size:1.15rem;color:var(--text-primary);margin-bottom:8px;font-weight:800}
.toast-container{position:fixed;bottom:24px;right:24px;left:24px;z-index:99999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--bg-card);color:var(--text-primary);padding:14px 24px;border-radius:var(--radius-sm);border-left:4px solid var(--accent-1);box-shadow:0 8px 30px rgba(0,0,0,.15);font-size:.9rem;font-weight:600;max-width:400px;border:1px solid var(--border-color);pointer-events:auto;margin-left:auto;animation:pageCardIn .3s}
.toast.success{border-left-color:var(--accent-4)}
.toast.error{border-left-color:var(--accent-danger)}
.toast.warning{border-left-color:var(--accent-3)}
.verified-badge{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;background:var(--verified-blue);border-radius:50%;color:#fff;font-size:8px;margin-left:5px;vertical-align:middle}
.mb-16{margin-bottom:16px}.mt-16{margin-top:16px}
.loading-screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at top,#e8f4f1 0%,#f0f4f8 70%);flex-direction:column;gap:0;z-index:99999;overflow:hidden}
body.dark .loading-screen{background:radial-gradient(ellipse at top,#0d2622 0%,#0a0a0a 70%)}
.loader-bg-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(18,140,126,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(18,140,126,.08) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(ellipse at center,black 25%,transparent 70%);-webkit-mask-image:radial-gradient(ellipse at center,black 25%,transparent 70%);animation:gridMove 20s linear infinite}
@keyframes gridMove{to{background-position:44px 44px,44px 44px}}
.loader-glow{position:absolute;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(18,140,126,.35),transparent 65%);filter:blur(60px);animation:pulse 3s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.15);opacity:1}}
.loader-content{position:relative;text-align:center;z-index:2;padding:20px;max-width:420px;width:100%}
.mex-logo-loader{display:flex;justify-content:center;gap:4px;font-size:64px;font-weight:900;letter-spacing:3px;margin-bottom:24px;font-family:'Inter',sans-serif}
.mex-logo-loader span{background:linear-gradient(135deg,#34d399,#128C7E,#0e6b5f);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:logoPop .7s cubic-bezier(.34,1.56,.64,1) backwards;text-shadow:0 0 40px rgba(18,140,126,.4);display:inline-block}
.mex-logo-loader .m{animation-delay:0s}.mex-logo-loader .e{animation-delay:.15s}.mex-logo-loader .x{animation-delay:.3s}
@keyframes logoPop{from{transform:translateY(30px) scale(.7);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
.loader-title{font-size:20px;font-weight:800;color:var(--text-primary);margin-bottom:24px;letter-spacing:.5px;animation:fadeIn .6s ease .3s backwards}
.loader-bar{width:100%;max-width:280px;height:4px;margin:0 auto;background:rgba(18,140,126,.15);border-radius:999px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.05)}
.loader-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent-1),#34d399);border-radius:999px;transition:width .35s cubic-bezier(.4,0,.2,1);box-shadow:0 0 12px rgba(18,140,126,.7)}
.video-wrapper{position:relative;width:100%;height:100%}
.video-wrapper video{width:100%;height:100%;object-fit:cover;display:block;background:#000}
.video-mute-btn{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.7)!important;color:#fff!important;border:none!important;border-radius:50%!important;width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:.9rem;cursor:pointer;z-index:5;backdrop-filter:blur(8px);transition:transform .15s,background .15s;padding:0}
.video-mute-btn:hover{background:rgba(0,0,0,.9)!important;transform:scale(1.1)}
.reset-warning{background:rgba(239,68,68,.08);border:2px dashed var(--accent-danger);border-radius:12px;padding:16px;margin-bottom:16px;font-size:.85rem;font-weight:600;color:var(--accent-danger);line-height:1.6;text-align:center}
.reset-warning i{font-size:1.8rem;display:block;margin-bottom:8px}
.error-screen{position:fixed;inset:0;background:#fee;color:#900;padding:40px;display:flex;flex-direction:column;gap:16px;z-index:999999;overflow:auto}
.error-screen h1{font-size:1.5rem;font-weight:800}
.error-screen pre{background:#fff;padding:16px;border-radius:8px;font-size:.8rem;white-space:pre-wrap;word-break:break-word}

/* Instagram-style post card */
.insta-ad{background:var(--bg-card);border-radius:14px;border:1px solid var(--border-color);box-shadow:var(--shadow-card);margin-bottom:16px;overflow:hidden;max-width:540px;margin-left:auto;margin-right:auto;width:100%}
.insta-header{display:flex;align-items:center;gap:10px;padding:10px 12px}
.insta-avatar{width:38px;height:38px;border-radius:50%;flex-shrink:0;padding:2px;background:linear-gradient(45deg,#f09433,#dc2743,#bc1888);cursor:pointer;transition:transform .15s}
.insta-avatar:hover{transform:scale(1.08)}
.insta-avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid var(--bg-card)}
.insta-meta{flex:1;min-width:0;line-height:1.2;cursor:pointer}
.insta-name{font-weight:700;font-size:.85rem;display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.insta-sub{font-size:.7rem;color:var(--text-muted);margin-top:2px}
.insta-delete{background:transparent!important;color:var(--accent-danger)!important;width:32px;height:32px;border-radius:50%!important;display:flex;align-items:center;justify-content:center}
.insta-media{position:relative;width:100%;background:#000;overflow:hidden;line-height:0;aspect-ratio:4/5;display:flex;align-items:center;justify-content:center;cursor:pointer}
.insta-media video,.insta-media img{width:100%;height:100%;object-fit:cover;display:block;background:#000}
@media(min-width:769px){.insta-media{aspect-ratio:auto;height:675px;max-height:none}}
.insta-promoted{display:inline-flex;align-items:center;gap:4px;background:linear-gradient(135deg,#8b5cf6,#6d28d9);color:#fff;font-size:.55rem;font-weight:800;padding:2px 6px;border-radius:20px;margin-right:6px}

/* IndexedDB */
let _dbPromise = null;
function openDB() {
  if (_dbPromise) return _dbPromise;
  _dbPromise = new Promise((resolve, reject) => {
    if (!window.indexedDB) return reject(new Error('No IndexedDB'));
    const req = indexedDB.open('mex_media_cache', 1);
    req.onupgradeneeded = () => { const db = req.result; if (!db.objectStoreNames.contains('media')) db.createObjectStore('media'); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return _dbPromise;
}
function dbSet(key, val) { return openDB().then(db => new Promise((res, rej) => { const tx = db.transaction('media', 'readwrite'); tx.objectStore('media').put(val, key); tx.oncomplete = () => res(true); tx.onerror = () => rej(tx.error); })); }
function dbGet(key) { return openDB().then(db => new Promise((res, rej) => { const tx = db.transaction('media', 'readonly'); const r = tx.objectStore('media').get(key); r.onsuccess = () => res(r.result == null ? null : r.result); r.onerror = () => rej(r.error); })); }

const _mediaUrlCache = {};
const _supabaseUploaded = new Set();
async function saveMediaBlob(blob, prefix) {
  const key = (prefix || 'media_') + Date.now() + '_' + Math.floor(Math.random() * 100000);
  try { await dbSet(key, blob); } catch (e) {}
  try { const url = URL.createObjectURL(blob); _mediaUrlCache[key] = url; } catch (e) {}
  if (supabase) {
    (async () => {
      try {
        const { error } = await supabase.storage.from(MEDIA_BUCKET).upload(key, blob, { contentType: blob.type || 'application/octet-stream', upsert: true });
        if (!error) _supabaseUploaded.add(key);
      } catch (e) {}
    })();
  }
  return key;
}
async function getMediaUrl(key) {
  if (!key) return '';
  if (_mediaUrlCache[key]) return _mediaUrlCache[key];
  try { const blob = await dbGet(key); if (blob) { const url = URL.createObjectURL(blob); _mediaUrlCache[key] = url; return url; } } catch (e) {}
  if (supabase) {
    try { const r = supabase.storage.from(MEDIA_BUCKET).getPublicUrl(key); if (r && r.data && r.data.publicUrl) { _mediaUrlCache[key] = r.data.publicUrl; return r.data.publicUrl; } } catch (e) {}
  }
  return '';
}
async function deleteMediaKey(key) {
  if (!key) return;
  delete _mediaUrlCache[key]; _supabaseUploaded.delete(key);
  if (supabase) { try { await supabase.storage.from(MEDIA_BUCKET).remove([key]); } catch (e) {} }
}

const _pendingPosts = {};
let _postTimer = null;
function schedulePostPush(ad) {
  if (!supabase || !ad || !ad.id) return;
  _pendingPosts[ad.id] = ad;
  if (_postTimer) clearTimeout(_postTimer);
  _postTimer = setTimeout(flushPosts, 400);
}
async function flushPosts() {
  const ids = Object.keys(_pendingPosts);
  if (!ids.length) return;
  const posts = {};
  ids.forEach(id => { posts[id] = _pendingPosts[id]; });
  const rows = ids.map(id => {
    const ad = posts[id];
    return {
      id: Number(ad.id), title: ad.title || '', content: ad.content || '',
      posted_by: ad.postedBy || 'company', poster_id: ad.posterId ? Number(ad.posterId) : null,
      tenant_id: ad.tenantId || null, author_name: ad.authorName || '',
      company_name: ad.companyName || '', media_key: ad.mediaKey || null,
      media_type: ad.mediaType || null, poster_key: ad.posterKey || null,
      promoted: !!ad.promoted, promoted_until: Number(ad.promotedUntil) || 0,
      promoted_at: Number(ad.promotedAt) || 0, views: Number(ad.views) || 0,
      likes_count: Array.isArray(ad.likes) ? ad.likes.length : 0,
      comments_count: (ad.comments || []).length,
      timestamp: Number(ad.timestamp) || Date.now(),
      updated_at: new Date().toISOString(),
    };
  });
  try {
    const { error } = await supabase.from('mex_posts').upsert(rows, { onConflict: 'id' });
    if (error) throw error;
    ids.forEach(id => { if (_pendingPosts[id] === posts[id]) delete _pendingPosts[id]; });
  } catch (e) { setTimeout(flushPosts, 3000); }
}

const _pushQueue = {}; let _pushTimer = null;
function queuePush(key, val) {
  if (!supabase) return;
  _pushQueue[key] = val;
  if (_pushTimer) clearTimeout(_pushTimer);
  _pushTimer = setTimeout(flushPush, 400);
}
async function flushPush() {
  const keys = Object.keys(_pushQueue);
  if (!keys.length) return;
  const writes = {};
  keys.forEach(k => { writes[k] = _pushQueue[k]; delete _pushQueue[k]; });
  const rows = keys.map(k => ({ key: k, value: writes[k], updated_at: new Date().toISOString() }));
  try { await supabase.from('mex_kv_store').upsert(rows, { onConflict: 'key' }); }
  catch (e) { Object.keys(writes).forEach(k => { if (!_pushQueue[k]) _pushQueue[k] = writes[k]; }); setTimeout(flushPush, 3000); }
}
function lsGet(key, def) {
  if (isSessionKey(key)) {
    try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : (def !== undefined ? def : null); }
    catch (e) { return def !== undefined ? def : null; }
  }
  return key in MEMORY ? MEMORY[key] : (def !== undefined ? def : null);
}
function lsSet(key, val) {
  if (isSessionKey(key)) {
    try { localStorage.setItem(key, JSON.stringify(val)); return true; }
    catch (e) { return false; }
  }
  MEMORY[key] = val;
  queuePush(key, val);
  if (key === K.GLOBAL_ADS && Array.isArray(val)) val.forEach(ad => { if (ad && ad.id) schedulePostPush(ad); });
  return true;
}
function lsDel(key) {
  if (isSessionKey(key)) { try { localStorage.removeItem(key); return true; } catch (e) { return false; } }
  delete MEMORY[key];
  if (supabase) supabase.from('mex_kv_store').delete().eq('key', key).catch(() => {});
  return true;
}
const tenantKey = (tid, k) => tid ? 'sb_tenant_' + tid + '_' + k : 'sb__' + k;

const setTenantData = (tid, k, v) => lsSet(tenantKey(tid, k), v);

/* ===== FOLLOW SYSTEM ===== */
function getUserKey(type, userId, tenantId) {
  if (type === 'super') return 'super';
  if (type === 'mex') return 'mex_' + userId;
  return 't_' + tenantId + '_' + userId;
}

function getFollowsData() {
  const data = lsGet(K.FOLLOWS, {});
  return (data && typeof data === 'object') ? data : {};
}

function setFollowsData(data) {
  lsSet(K.FOLLOWS, data);
}

function isFollowing(myKey, theirKey) {
  if (!myKey || !theirKey || myKey === theirKey) return false;
  const data = getFollowsData();
  const me = data[myKey];
  if (!me || !Array.isArray(me.following)) return false;
  return me.following.indexOf(theirKey) !== -1;
}

function followUser(myKey, theirKey) {
  if (!myKey || !theirKey || myKey === theirKey) return false;
  const data = Object.assign({}, getFollowsData());
  if (!data[myKey]) data[myKey] = { following: [], followers: [] };
  if (!data[theirKey]) data[theirKey] = { following: [], followers: [] };
  if (!Array.isArray(data[myKey].following)) data[myKey].following = [];
  if (!Array.isArray(data[theirKey].followers)) data[theirKey].followers = [];
  if (data[myKey].following.indexOf(theirKey) === -1) data[myKey].following.push(theirKey);
  if (data[theirKey].followers.indexOf(myKey) === -1) data[theirKey].followers.push(myKey);
  setFollowsData(data);
  return true;
}

function unfollowUser(myKey, theirKey) {
  if (!myKey || !theirKey) return false;
  const data = Object.assign({}, getFollowsData());
  if (data[myKey] && Array.isArray(data[myKey].following)) data[myKey].following = data[myKey].following.filter(k => k !== theirKey);
  if (data[theirKey] && Array.isArray(data[theirKey].followers)) data[theirKey].followers = data[theirKey].followers.filter(k => k !== myKey);
  setFollowsData(data);
  return true;
}

function getFollowerCount(userKey) {
  const data = getFollowsData();
  const u = data[userKey];
  return (u && Array.isArray(u.followers)) ? u.followers.length : 0;
}

function getFollowingCount(userKey) {
  const data = getFollowsData();
  const u = data[userKey];
  return (u && Array.isArray(u.following)) ? u.following.length : 0;
}

function getFollowers(userKey) {
  const data = getFollowsData();
  const u = data[userKey];
  return (u && Array.isArray(u.followers)) ? u.followers.slice() : [];
}

function getFollowing(userKey) {
  const data = getFollowsData();
  const u = data[userKey];
  return (u && Array.isArray(u.following)) ? u.following.slice() : [];
}

/* Resolve user info from userKey */
function resolveUserInfoByKey(key) {
  if (!key) return null;
  if (key === 'super') return { type: 'super', name: 'MeX Admin', username: 'Mex', role: 'Super Admin', verified: true, photoKey: '' };
  if (key.indexOf('mex_') === 0) {
    const id = Number(key.substring(4));
    const emp = findMexEmployeeById(id);
    if (!emp) return null;
    return { type: 'mex', userId: emp.id, name: emp.name, username: emp.username, role: 'Member', verified: true, photoKey: emp.photoKey, promoCode: emp.promoCode };
  }
  if (key.indexOf('t_') === 0) {
    const parts = key.substring(2).split('_');
    if (parts.length < 2) return null;
    const userId = Number(parts[parts.length - 1]);
    const tenantId = parts.slice(0, -1).join('_');
    const tn = getTenant(tenantId);
    if (!tn) return null;
    const users = getTenantData(tenantId, 'users', []);
    const u = users.find(x => Number(x.id) === userId);
    if (!u) return null;
    return { type: 'tenant', userId: u.id, tenantId, name: u.fullName || u.username, username: u.username, role: getRoleLabel(u.role), verified: u.role === 'owner', photoKey: u.photoKey };
  }
  return null;
}

async function loadAllFromSupabase() {
  if (!supabase) return { ok: false, reason: 'no-supabase' };
  try {
    const [kvRes, postRes] = await Promise.all([
      supabase.from('mex_kv_store').select('key,value'),
      supabase.from('mex_posts').select('*').order('timestamp', { ascending: false }).limit(500),
    ]);
    if (kvRes.error) throw kvRes.error;
    if (kvRes.data) {
      kvRes.data.forEach(row => {
        if (!shouldSync(row.key)) return;
        if (_pushQueue[row.key]) return;
        if (row.value !== null && row.value !== undefined) MEMORY[row.key] = row.value;
      });
    }
    if (postRes.data && postRes.data.length) {
      const ids = postRes.data.map(p => p.id);
      const [likesRes, commentsRes] = await Promise.all([
        supabase.from('mex_post_likes').select('*').in('post_id', ids),
        supabase.from('mex_post_comments').select('*').in('post_id', ids),
      ]);
      const likesBy = {};
      (likesRes.data || []).forEach(l => { if (!likesBy[l.post_id]) likesBy[l.post_id] = []; likesBy[l.post_id].push(l.user_key); });
      const cmtsBy = {};
      (commentsRes.data || []).forEach(c => { if (!cmtsBy[c.post_id]) cmtsBy[c.post_id] = []; cmtsBy[c.post_id].push(c); });
      const serverAds = postRes.data.map(p => {
        const ac = cmtsBy[p.id] || [];
        const byId = {};
        ac.forEach(c => { byId[c.id] = { id: c.id, userId: c.user_id, userName: c.user_name || 'User', photoKey: c.photo_key || '', text: c.text || '', timestamp: Number(c.timestamp) || 0, replies: [] }; });
        const top = [];
        ac.forEach(c => { const obj = byId[c.id]; if (c.parent_id && byId[c.parent_id]) { obj.parentId = c.parent_id; byId[c.parent_id].replies.push(obj); } else top.push(obj); });
        return {
          id: p.id, title: p.title || '', content: p.content || '',
          postedBy: p.posted_by || 'company', posterId: p.poster_id || null,
          tenantId: p.tenant_id || null, authorName: p.author_name || '',
          companyName: p.company_name || '', mediaKey: p.media_key || null,
          mediaType: p.media_type || null, posterKey: p.poster_key || null,
          promoted: !!p.promoted, promotedUntil: Number(p.promoted_until) || 0,
          promotedAt: Number(p.promoted_at) || 0, views: Number(p.views) || 0,
          timestamp: Number(p.timestamp) || Date.now(),
          likes: likesBy[p.id] || [], comments: top,
        };
      });
      const pendingIds = new Set(Object.keys(_pendingPosts));
      const localAds = MEMORY[K.GLOBAL_ADS] || [];
      const pendingLocal = localAds.filter(a => a && pendingIds.has(String(a.id)));
      const serverOnly = serverAds.filter(a => !pendingIds.has(String(a.id)));
      MEMORY[K.GLOBAL_ADS] = [...pendingLocal, ...serverOnly];
    }
    return { ok: true };
  } catch (e) { return { ok: false, reason: e.message }; }
}

const isTenantSuspended = (id) => { const tn = getTenant(id); if (!tn) return true; if (tn.blocked) return true; const tE = (tn.createdAt || 0) + FREE_TRIAL_MS; const sE = lsGet('sb_tenant_' + id + '_subscription_expiry', 0) || 0; return Date.now() > Math.max(tE, sE); };
const getTenantDaysLeft = (id) => { const tn = getTenant(id); if (!tn) return 0; const tE = (tn.createdAt || 0) + FREE_TRIAL_MS; const sE = lsGet('sb_tenant_' + id + '_subscription_expiry', 0) || 0; return Math.max(0, Math.ceil((Math.max(tE, sE) - Date.now()) / 86400000)); };
const isTenantOnTrial = (id) => { const tn = getTenant(id); if (!tn) return false; const tE = (tn.createdAt || 0) + FREE_TRIAL_MS; const sE = lsGet('sb_tenant_' + id + '_subscription_expiry', 0) || 0; return Date.now() <= tE && Date.now() > sE; };
const getBranchByName = (tid, name) => { const tn = getTenant(tid); if (!tn || !Array.isArray(tn.branches)) return null; return tn.branches.find(b => b.name === name) || null; };
const isUsernameTaken = (username) => {
  const u = normalizeUsername(username);
  if (!u) return false;
  if (u === normalizeUsername(SUPER_ADMIN_USERNAME)) return true;
  for (const e of lsGet(K.MEX_EMPLOYEES, [])) if (normalizeUsername(e.username) === u) return true;
  for (const t of getAllTenants()) { if (normalizeUsername(t.ownerUsername) === u) return true; for (const us of lsGet('sb_tenant_' + t.id + '_users', [])) if (normalizeUsername(us.username) === u) return true; }
  return false;
};
const getLikeKey = (session) => { if (session.type === 'super') return 'super'; if (session.type === 'mex') return 'mex_' + session.mexEmpId; return 't_' + session.tenantId + '_' + session.user.id; };
const normalizeWaNumber = (num) => { if (!num) return ''; let n = String(num).replace(/\D/g, ''); if (!n) return ''; if (n.indexOf('0') === 0) n = '255' + n.substring(1); if (n.indexOf('255') !== 0 && n.length <= 10) n = '255' + n; return n; };
const getAvatarSrc = (user) => {
  if (!user) return avatarUrl('User');
  const pk = user.photoKey;
  if (!pk) return avatarUrl(user.fullName || user.name || user.username);
  if (_mediaUrlCache[pk]) return _mediaUrlCache[pk];
  getMediaUrl(pk).then(url => { if (url) document.querySelectorAll('img[data-avatar-key="' + pk + '"]').forEach(el => { if (el.src !== url) el.src = url; }); }).catch(() => {});
  return avatarUrl(user.fullName || user.name || user.username);
};

function creditMemberCommission(tenant) {
  if (!tenant || !tenant.promoCode) return null;
  const emp = findMexEmployeeByPromo(tenant.promoCode);
  if (!emp) return null;
  const planKey = ['monthly','quarterly','yearly'].indexOf(tenant.planKey) !== -1 ? tenant.planKey : 'monthly';
  const price = SUB_PRICES[planKey] || 25000;
  const commission = Math.round(price * COMMISSION_RATE);
  const earnings = lsGet(K.MEMBER_EARNINGS, []);
  const exists = earnings.find(e => Number(e.companyId) === Number(tenant.id) || e.companyId === tenant.id);
  if (exists) return exists;
  const entry = { id: uid(), employeeId: emp.id, employeeName: emp.name, companyId: tenant.id, companyName: tenant.companyName, ownerUsername: tenant.ownerUsername || '', planKey, planPrice: price, commissionRate: COMMISSION_RATE, commissionAmount: commission, earningType: 'signup', date: Date.now(), paid: false, paidAt: null, approvedBy: null };
  earnings.push(entry); lsSet(K.MEMBER_EARNINGS, earnings);
  const emps = lsGet(K.MEX_EMPLOYEES, []);
  const idx = emps.findIndex(e => Number(e.id) === Number(emp.id));
  if (idx >= 0) {
    if (!Array.isArray(emps[idx].registeredCompanyIds)) emps[idx].registeredCompanyIds = [];
    if (!emps[idx].registeredCompanyIds.find(c => c.companyId === tenant.id)) {
      emps[idx].registeredCompanyIds.push({ companyId: tenant.id, companyName: tenant.companyName, ownerUsername: tenant.ownerUsername, date: Date.now() });
      emps[idx].totalRegistrations = (emps[idx].totalRegistrations || 0) + 1;
      lsSet(K.MEX_EMPLOYEES, emps);
    }
  }
  return entry;
}

/* Instagram Video */
function InstagramVideo({ src, poster, onClick }) {
  const ref = useRef(null);
  const [muted, setMuted] = useState(true);
  const [userManualMute, setUserManualMute] = useState(null);
  useEffect(() => {
    const video = ref.current;
    if (!video) return;
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (!entry.isIntersecting) { try { video.pause(); } catch (e) {} return; }
        if (entry.intersectionRatio >= 0.7) {
          try { const p = video.play(); if (p && p.catch) p.catch(() => {}); } catch (e) {}
          if (userManualMute !== true) { video.muted = false; setMuted(false); }
        } else if (entry.intersectionRatio > 0.2) {
          try { const p = video.play(); if (p && p.catch) p.catch(() => {}); } catch (e) {}
          video.muted = true; setMuted(true);
        } else { try { video.pause(); } catch (e) {} }
      });
    }, { threshold: [0, 0.2, 0.5, 0.7, 0.9, 1] });
    observer.observe(video);
    return () => { observer.disconnect(); };
  }, [userManualMute]);
  const toggleMute = (e) => {
    e.stopPropagation();
    if (!ref.current) return;
    const newMuted = !ref.current.muted;
    ref.current.muted = newMuted;
    setMuted(newMuted);
    setUserManualMute(newMuted);
  };
  return (
    <div className="video-wrapper" onClick={onClick}>
      <video ref={ref} src={src} poster={poster} autoPlay loop muted playsInline preload="metadata" style={{ pointerEvents: 'none' }} />
      <button className="video-mute-btn" onClick={toggleMute} title={muted ? 'Unmute' : 'Mute'} type="button" aria-label={muted ? 'Unmute' : 'Mute'}>
        <i className={muted ? 'fas fa-volume-mute' : 'fas fa-volume-up'} />
      </button>
    </div>
  );
}

        info = { name: emp.name, username: emp.username, role: 'Member', verified: true, photoKey: emp.photoKey, promoCode: emp.promoCode, bio: emp.bio };
        filtered = allAds.filter(a => a.postedBy === 'mex' && Number(a.posterId) === Number(userId));
      }
    } else if (userType === 'tenant') {
      const tn = getTenant(tenantId);
      if (tn) {
        const users = getTenantData(tenantId, 'users', []);
        const owner = users.find(u => u.role === 'owner') || users.find(u => Number(u.id) === Number(userId));
        info = { name: tn.companyName, username: tn.ownerUsername, role: 'Company', verified: true, photoKey: owner?.photoKey || '', bio: owner?.bio };
        filtered = allAds.filter(a => a.postedBy === 'tenant' && a.tenantId === tenantId);
      }
    }
    setUserInfo(info);
    setAds(filtered.slice().sort((a, b) => b.timestamp - a.timestamp));
    setFollowing(isFollowing(myKey, theirKey));
    setFollowerCount(getFollowerCount(theirKey));
    setFollowingCount(getFollowingCount(theirKey));
    setFollowsMe(isFollowing(theirKey, myKey));
  }, [userType, userId, tenantId, refreshTick, myKey, theirKey]);

  useEffect(() => {
    (async () => {
      const urls = {};
      for (const ad of ads) {
        if (ad.mediaKey) { try { urls[ad.mediaKey] = await getMediaUrl(ad.mediaKey); } catch (e) {} }
        if (ad.posterKey) { try { urls[ad.posterKey] = await getMediaUrl(ad.posterKey); } catch (e) {} }
      }
      setMediaUrls(urls);
    })();
  }, [ads]);

  const toggleFollow = () => {
    if (isOwnProfile) return;
    if (following) {
      unfollowUser(myKey, theirKey);
      setFollowing(false);
      setFollowerCount(c => Math.max(0, c - 1));
      toast('Unfollowed', 'info');
    } else {
      followUser(myKey, theirKey);
      setFollowing(true);
      setFollowerCount(c => c + 1);
      toast('✅ Following', 'success');
    }
    if (onFollowChange) onFollowChange();
  };

  const refreshAds = () => {
    const allAds = lsGet(K.GLOBAL_ADS, []);
    let filtered = [];
    if (userType === 'super') filtered = allAds.filter(a => a.postedBy === 'super');
    else if (userType === 'mex') filtered = allAds.filter(a => a.postedBy === 'mex' && Number(a.posterId) === Number(userId));
    else if (userType === 'tenant') filtered = allAds.filter(a => a.postedBy === 'tenant' && a.tenantId === tenantId);
    setAds(filtered.slice().sort((a, b) => b.timestamp - a.timestamp));
  };

  const like = (id) => {
    const all = lsGet(K.GLOBAL_ADS, []);
    const updated = all.map(a => { if (a.id !== id) return a; const likes = a.likes || []; const idx = likes.indexOf(myKey); return Object.assign({}, a, { likes: idx >= 0 ? likes.filter(l => l !== myKey) : likes.concat([myKey]) }); });
    lsSet(K.GLOBAL_ADS, updated);
    refreshAds();
    if (viewPost && viewPost.id === id) setViewPost(updated.find(a => a.id === id));
  };

  const openPost = (ad) => {
    const all = lsGet(K.GLOBAL_ADS, []);
    const updated = all.map(a => a.id === ad.id ? Object.assign({}, a, { views: (Number(a.views) || 0) + 30 }) : a);
    lsSet(K.GLOBAL_ADS, updated);
    setViewPost(updated.find(a => a.id === ad.id));
    setCommentText('');
  };

  const addCommentToPost = () => {
    if (!commentText.trim() || !viewPost) return;
    const newC = { id: uid(), userId: session.type === 'super' ? 0 : (session.type === 'mex' ? session.mexEmpId : session.user.id), userName: session.type === 'super' ? 'Super Admin' : (session.user.fullName || session.user.name || session.user.username), text: commentText.trim(), timestamp: Date.now() };
    const all = lsGet(K.GLOBAL_ADS, []);
    const updated = all.map(a => a.id === viewPost.id ? Object.assign({}, a, { comments: (a.comments || []).concat([newC]) }) : a);
    lsSet(K.GLOBAL_ADS, updated);
    setViewPost(updated.find(a => a.id === viewPost.id));
    setCommentText('');
    refreshAds();
    toast('✓ Comment added', 'success');
  };

  const openUserList = (mode) => { setListMode(mode); setListModalOpen(true); };

  const handleUserFromList = (key) => {
    const info = resolveUserInfoByKey(key);
    if (!info) return toast('User not found', 'error');
    if (onFollowChange) { onFollowChange(); }
    // Trigger re-render with new target
    setListModalOpen(false);
    setRefreshTick(t => t + 1);
  };

  const getListUsers = () => {
    const keys = listMode === 'followers' ? getFollowers(theirKey) : getFollowing(theirKey);
    return keys.map(k => ({ key: k, info: resolveUserInfoByKey(k) })).filter(x => x.info);
  };

  if (!userInfo) {
    return (<Modal open={true} onClose={onClose} title="Profile" icon="fas fa-user"><div className="empty-state"><i className="fas fa-user-slash" /><h3>User not found</h3></div></Modal>);
  }

  const avatarSrc = userInfo.photoKey ? (_mediaUrlCache[userInfo.photoKey] || avatarUrl(userInfo.name)) : avatarUrl(userInfo.name);

  return (
    <Modal open={true} onClose={onClose} title="" maxWidth={680} className="profile-view-modal">
      {/* Header */}
      <div className="profile-view-header">
        <div className="profile-view-top">
          <div className="profile-view-avatar">
            <img src={avatarSrc} alt="" data-avatar-key={userInfo.photoKey || ''} />
          </div>
          <div className="profile-view-stats">
            <div className="profile-view-stat" onClick={() => toast(`${ads.length} posts`)}>
              <div className="profile-view-stat-num">{ads.length}</div>
              <div className="profile-view-stat-label">Posts</div>
            </div>
            <div className="profile-view-stat" onClick={() => openUserList('followers')}>
              <div className="profile-view-stat-num">{followerCount}</div>
              <div className="profile-view-stat-label">Followers</div>
            </div>
            <div className="profile-view-stat" onClick={() => openUserList('following')}>
              <div className="profile-view-stat-num">{followingCount}</div>
              <div className="profile-view-stat-label">Following</div>
            </div>
          </div>
        </div>
        <div className="profile-view-info">
          <div className="profile-view-name">{userInfo.name} {userInfo.verified ? <span className="verified-badge"><i className="fas fa-check" /></span> : null}</div>
          <div className="profile-view-username">@{userInfo.username}</div>
          {userInfo.bio ? <div className="profile-view-bio">{userInfo.bio}</div> : null}
          <div>
            <span className="profile-view-badge"><i className="fas fa-shield-alt" /> {userInfo.role}</span>
            {followsMe && !isOwnProfile ? <span className="profile-view-badge-follows-you"><i className="fas fa-user-check" /> Follows you</span> : null}
          </div>
          {userInfo.promoCode ? (
            <div style={{ marginTop: 10, padding: 10, background: 'rgba(245,158,11,.12)', borderRadius: 10, display: 'inline-block' }}>
              <div style={{ fontSize: '.65rem', fontWeight: 800, color: '#d97706' }}>PROMO CODE</div>
              <div style={{ fontFamily: 'monospace', fontWeight: 900, color: '#d97706', fontSize: '1rem', cursor: 'pointer' }} onClick={() => { navigator.clipboard.writeText(userInfo.promoCode); toast('📋 Copied', 'success'); }}>{userInfo.promoCode}</div>
            </div>
          ) : null}
          {!isOwnProfile ? (
            <div className="profile-view-actions">
              <button className={following ? 'profile-btn-following' : 'profile-btn-follow'} onClick={toggleFollow}>
                {following ? <><i className="fas fa-user-check" /> Following</> : <><i className="fas fa-user-plus" /> Follow</>}
              </button>
              <button className="profile-btn-message" onClick={() => { if (onOpenChat) onOpenChat(userType, userId, tenantId); else onClose(); }}>
                <i className="fas fa-comment-dots" /> Message
              </button>
            </div>
          ) : null}
        </div>
      </div>

      {/* Grid tabs */}
      <div className="profile-grid-tabs">
        <div className={'profile-grid-tab ' + (tab === 'posts' ? 'active' : '')} onClick={() => setTab('posts')}>
          <i className="fas fa-th" /> Posts
        </div>
      </div>

      {/* Grid */}
      {tab === 'posts' ? (
        ads.length === 0 ? (
          <div className="profile-empty-state">
            <i className="fas fa-camera-retro" />
            <h4>No Posts Yet</h4>
            <p>When {userInfo.name} shares posts, they will appear here.</p>
          </div>
        ) : (
          <div className="profile-post-grid">
            {ads.map(ad => {
              const mediaUrl = ad.mediaKey ? (mediaUrls[ad.mediaKey] || '') : '';
              const posterUrl = ad.posterKey ? (mediaUrls[ad.posterKey] || '') : '';
              return (
                <div key={ad.id} className="profile-post-tile" onClick={() => openPost(ad)}>
                  {mediaUrl && ad.mediaType === 'video' ? (
                    <>
                      <video src={mediaUrl} poster={posterUrl} muted playsInline preload="metadata" />
                      <div className="profile-post-tile-video-badge"><i className="fas fa-video" /></div>
                    </>
                  ) : mediaUrl && ad.mediaType === 'image' ? (
                    <img src={mediaUrl} alt="" />
                  ) : (
                    <div className="profile-post-tile-placeholder"><i className="fas fa-quote-left" style={{ marginRight: 6 }} />{ad.title || ad.content?.slice(0, 40) || 'Post'}</div>
                  )}
                </div>
              );
            })}
          </div>
        )
      ) : null}

      {/* Followers/Following List Modal */}
      <Modal open={listModalOpen} onClose={() => setListModalOpen(false)} title={listMode === 'followers' ? 'Followers' : 'Following'} icon={listMode === 'followers' ? 'fas fa-users' : 'fas fa-user-friends'} maxWidth={480}>
        {getListUsers().length === 0 ? (
          <div className="empty-state" style={{ padding: '30px 20px' }}>
            <i className="fas fa-user-friends" />
            <h3>No {listMode === 'followers' ? 'followers' : 'following'} yet</h3>
          </div>
        ) : (
          <div>
            {getListUsers().map(({ key, info }) => (
              <div key={key} className="user-list-item">
                <div className="user-list-avatar"><img src={info.photoKey ? (_mediaUrlCache[info.photoKey] || avatarUrl(info.name)) : avatarUrl(info.name)} alt="" data-avatar-key={info.photoKey || ''} /></div>
                <div className="user-list-info">
                  <div className="user-list-name" onClick={() => { setListModalOpen(false); onClose(); }}>
                    {info.name} {info.verified ? <span className="verified-badge"><i className="fas fa-check" /></span> : null}
                  </div>
                  <div className="user-list-username">@{info.username} · {info.role}</div>
                </div>
              </div>
            ))}
          </div>
        )}
      </Modal>

      {/* Post Detail Modal */}
      {viewPost ? (
        <Modal open={true} onClose={() => setViewPost(null)} title="" maxWidth={900} className="post-detail-box">
          <div className="post-detail-layout">
            <div className="post-detail-media">
              {viewPost.mediaKey && viewPost.mediaType === 'video' ? (
                <video src={mediaUrls[viewPost.mediaKey] || ''} controls autoPlay loop playsInline style={{ maxWidth: '100%', maxHeight: '100%' }} />
              ) : viewPost.mediaKey && viewPost.mediaType === 'image' ? (
                <img src={mediaUrls[viewPost.mediaKey] || ''} alt="" style={{ maxWidth: '100%', maxHeight: '100%' }} />
              ) : (
                <div style={{ padding: 40, color: '#fff', textAlign: 'center', fontSize: '1.1rem', fontWeight: 700 }}>{viewPost.title || viewPost.content}</div>
              )}
            </div>
            <div className="post-detail-sidebar">
              <div className="post-detail-header">
                <div className="insta-avatar" style={{ width: 32, height: 32 }}><img src={avatarUrl(viewPost.companyName)} alt="" /></div>
                <div>
                  <div style={{ fontSize: '.85rem', fontWeight: 700 }}>{viewPost.companyName}</div>
                  <div style={{ fontSize: '.7rem', color: 'var(--text-muted)' }}>{fmtRelative(viewPost.timestamp)}</div>
                </div>
                <button className="modal-close-btn" style={{ position: 'static', marginLeft: 'auto', width: 32, height: 32 }} onClick={() => setViewPost(null)}><i className="fas fa-times" /></button>
              </div>
              <div className="post-detail-caption">
                <span style={{ fontWeight: 700, marginRight: 6 }}>{viewPost.companyName}</span>
                {viewPost.title ? <strong>{viewPost.title}</strong> : null}
                <div style={{ marginTop: 4, color: 'var(--text-secondary)' }}>{viewPost.content}</div>
              </div>
              <div className="post-detail-comments">
                {(viewPost.comments || []).length === 0 ? (
                  <div style={{ textAlign: 'center', padding: 30, color: 'var(--text-muted)', fontSize: '.82rem' }}>No comments yet</div>
                ) : (
                  (viewPost.comments || []).map(c => (
                    <div key={c.id} className="comment-item">
                      <img className="comment-avatar" src={avatarUrl(c.userName)} alt="" />
                      <div className="comment-body">
                        <span className="comment-author">{c.userName}</span>
                        <span>{c.text}</span>
                        <span className="comment-time">{fmtRelative(c.timestamp)}</span>
                      </div>
                    </div>
                  ))
                )}
              </div>
              <div className="post-detail-actions">
                <button className={'insta-action-btn ' + ((viewPost.likes || []).indexOf(myKey) >= 0 ? 'liked' : '')} onClick={() => like(viewPost.id)}>
                  <i className={(viewPost.likes || []).indexOf(myKey) >= 0 ? 'fas fa-heart' : 'far fa-heart'} />
                  <span className="cnt">{(viewPost.likes || []).length || ''}</span>
                </button>
                <span style={{ fontSize: '.85rem', color: 'var(--text-muted)' }}><i className="fas fa-comment" /> {(viewPost.comments || []).length}</span>
                <span className="insta-views" style={{ marginLeft: 'auto' }}><i className="far fa-eye" />{fmtViews(viewPost.views || 0)}</span>
              </div>
              <div className="post-detail-comment-input">
                <input placeholder="Add a comment..." value={commentText} onChange={e => setCommentText(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); addCommentToPost(); } }} />
                <Btn size="sm" onClick={addCommentToPost} disabled={!commentText.trim()}>Post</Btn>
              </div>
            </div>
          </div>
        </Modal>
      ) : null}
    </Modal>
  );
}

/* Scanner */
function ScannerModal({ open, onClose, mode, tenantId, session, toast }) {
  const [status, setStatus] = useState({ text: '', kind: 'info' });
  const [manual, setManual] = useState('');
  const [scanCount, setScanCount] = useState(0);
  const [scanTotal, setScanTotal] = useState(0);
  const [scanLocked, setScanLocked] = useState(false);
  const [invForm, setInvForm] = useState(null);
  const readerRef = useRef(null);
  const scannerRef = useRef(null);
  const mountedRef = useRef(true);
  const lastRef = useRef({ code: '', time: 0 });
  const runningRef = useRef(false);

  const products = getTenantData(tenantId, 'products', []);
  const isB = session.user.role === 'employee' && session.user.store;
  const filtered = isB ? products.filter(p => p.store === session.user.store) : products;

  const stopScanner = () => {
    runningRef.current = false;
    if (scannerRef.current) {
      const inst = scannerRef.current;
      scannerRef.current = null;
      try { inst.stop().then(() => { try { inst.clear(); } catch (e) {} }).catch(() => {}); } catch (e) {}
    }
  };

  const startScanner = () => {
    if (typeof Html5Qrcode === 'undefined') { setStatus({ text: '⚠ Camera library not loaded', kind: 'fail' }); return; }
    if (!readerRef.current) return;
    if (runningRef.current) return;
    if (scannerRef.current) { stopScanner(); }
    readerRef.current.innerHTML = '';
    try {
      const inst = new Html5Qrcode('scannerReader');
      scannerRef.current = inst;
      runningRef.current = true;
      inst.start(
        { facingMode: 'environment' },
        { fps: 10, qrbox: { width: 260, height: 180 } },
        (text) => { if (!scanLocked) processBarcode(text, false); },
        () => {}
      ).catch(err => {
        runningRef.current = false;
        const msg = (err && err.message) || String(err);
        setStatus({ text: '⚠ ' + (msg.indexOf('NotAllowed') !== -1 ? 'Camera permission denied — use manual input' : msg.indexOf('NotFound') !== -1 ? 'No camera — use manual input' : 'Camera error'), kind: 'fail' });
      });
    } catch (e) { runningRef.current = false; setStatus({ text: '⚠ Camera error', kind: 'fail' }); }
  };

  useEffect(() => {
    mountedRef.current = true;
    return () => { mountedRef.current = false; stopScanner(); };
  }, []);

  useEffect(() => {
    if (open) {
      setStatus({ text: '', kind: 'info' });
      setManual(''); setScanCount(0); setScanTotal(0);
      setScanLocked(false); setInvForm(null);
      setTimeout(() => { if (mountedRef.current && open) startScanner(); }, 350);
    } else { stopScanner(); }
    return () => { stopScanner(); };
  }, [open]);

  const findProduct = (code) => { const t = String(code).trim().toLowerCase(); return filtered.find(p => p.barcode && String(p.barcode).trim().toLowerCase() === t); };

  const processBarcode = (rawCode, isManual) => {
    const code = String(rawCode || '').trim();
    if (!code) return;
    if (!isManual) {
      const now = Date.now();
      if (lastRef.current.code === code && now - lastRef.current.time < 1200) return;
      lastRef.current = { code, time: now };
    }
    setScanLocked(true);
    stopScanner();

    if (mode === 'inventory') {
      const existing = findProduct(code);
      if (existing) {
        playFailSound();
        setStatus({ text: '⚠ Already exists: ' + existing.name, kind: 'fail' });
        toast('Already exists: ' + existing.name, 'warning');
        setTimeout(() => { if (mountedRef.current && open) { setScanLocked(false); startScanner(); } }, 1600);
        return;
      }
      playSuccessSound();
      setStatus({ text: '✅ Scanned: ' + code + ' — Fill product details', kind: 'ok' });
      toast('✅ Scanned: ' + code, 'success');
      setInvForm({ barcode: code, name: '', price: 0, cost: 0, quantity: 0, category: 'General' });
      return;
    }

    const product = findProduct(code);
    if (!product) {
      playFailSound();
      setStatus({ text: '⚠ Product not found: ' + code, kind: 'fail' });
      toast('Product not found', 'warning');
      setTimeout(() => { if (mountedRef.current && open) { setScanLocked(false); startScanner(); } }, 1600);
      return;
    }
    if (Number(product.quantity) <= 0) {
      playFailSound();
      setStatus({ text: '⚠ Out of stock: ' + product.name, kind: 'fail' });
      toast('Out of stock', 'error');
      setTimeout(() => { if (mountedRef.current && open) { setScanLocked(false); startScanner(); } }, 1600);
      return;
    }

    playSuccessSound();
    const allP = getTenantData(tenantId, 'products', []);
    const allS = getTenantData(tenantId, 'sales', []);
    const sale = { id: uid(), productId: product.id, quantity: 1, totalPrice: Number(product.price) || 0, totalCost: Number(product.cost) || 0, unitPrice: Number(product.price) || 0, unitCost: Number(product.cost) || 0, date: Date.now(), customer: '', store: session.user.store || '', createdBy: session.user.id, paid: true };
    setTenantData(tenantId, 'sales', allS.concat([sale]));
    setTenantData(tenantId, 'products', allP.map(p => Number(p.id) === Number(product.id) ? Object.assign({}, p, { quantity: p.quantity - 1 }) : p));
    setStatus({ text: '✅ Sold: ' + product.name + ' — ' + fmtMoney(product.price), kind: 'ok' });
    toast('✅ Sold: ' + product.name, 'success');
    setScanCount(c => c + 1);
    setScanTotal(t => t + (Number(product.price) || 0));
    setTimeout(() => { if (mountedRef.current && open) { setScanLocked(false); startScanner(); } }, 1200);
  };

  const handleManual = () => {
    const v = manual.trim();
    if (!v) { playFailSound(); toast('Enter barcode', 'warning'); return; }
    setManual('');
    processBarcode(v, true);
  };

  const saveInvProduct = () => {
    if (!invForm) return;
    if (!invForm.name.trim() || !Number(invForm.price)) { playFailSound(); toast('Fill name and price', 'error'); return; }
    const newP = {
      id: uid(), name: invForm.name.trim(),
      price: Number(invForm.price), cost: Number(invForm.cost) || 0,
      quantity: Number(invForm.quantity) || 0,
      category: invForm.category || 'General',
      barcode: invForm.barcode,
      store: session.user.store || (getTenant(tenantId)?.companyName || 'Store')
    };
    const allP = getTenantData(tenantId, 'products', []);
    setTenantData(tenantId, 'products', allP.concat([newP]));
    playSuccessSound();
    toast('✅ Product added — Ready to scan next', 'success');
    setInvForm(null);
    setStatus({ text: '✅ Saved! Scanning again…', kind: 'ok' });
    setTimeout(() => { if (mountedRef.current && open) { setScanLocked(false); startScanner(); } }, 600);
  };

  const cancelInvForm = () => {
    setInvForm(null);
    setStatus({ text: 'Ready to scan', kind: 'info' });
    setTimeout(() => { if (mountedRef.current && open) { setScanLocked(false); startScanner(); } }, 300);
  };

  if (!open) return null;

  const statusCls = status.kind === 'ok' ? 'scan-status ok' : status.kind === 'fail' ? 'scan-status fail' : 'scan-status info';

  return (
    <Modal open={open} onClose={() => { stopScanner(); onClose(); }} title="Scan Barcode" icon="fas fa-barcode" maxWidth={560}>
      <div className="scanner-view" id="scannerReader" ref={readerRef}></div>
      <div className="scanner-hint"><i className="fas fa-info-circle" /> Point camera at barcode</div>
      {status.text ? <div className={statusCls}>{status.text}</div> : null}
      {mode === 'sale' ? (
        <div className="scanner-stats">
          <div style={{ textAlign: 'center', flex: 1 }}><div className="ss-num">{scanCount}</div><div className="ss-label">Items</div></div>
          <div style={{ width: 1, height: 36, background: 'rgba(255,255,255,.3)' }} />
          <div style={{ textAlign: 'center', flex: 1 }}><div className="ss-num">{fmtMoney(scanTotal)}</div><div className="ss-label">Total</div></div>
        </div>
      ) : null}
      {invForm ? (
        <div style={{ background: 'rgba(18,140,126,.06)', borderRadius: 12, padding: 14, marginTop: 14 }}>
          <div style={{ fontSize: '.75rem', fontWeight: 800, color: 'var(--accent-1)', marginBottom: 10 }}><i className="fas fa-barcode" /> NEW PRODUCT — {invForm.barcode}</div>
          <Input label="Name" value={invForm.name} onChange={e => setInvForm({ ...invForm, name: e.target.value })} autoFocus />
          <div className="form-row"><Input label="Price (TSh)" type="number" min="0" value={invForm.price} onChange={e => setInvForm({ ...invForm, price: e.target.value })} /><Input label="Cost (TSh)" type="number" min="0" value={invForm.cost} onChange={e => setInvForm({ ...invForm, cost: e.target.value })} /></div>
          <div className="form-row"><Input label="Quantity" type="number" min="0" value={invForm.quantity} onChange={e => setInvForm({ ...invForm, quantity: e.target.value })} /><Input label="Category" value={invForm.category} onChange={e => setInvForm({ ...invForm, category: e.target.value })} /></div>
          <div className="form-actions" style={{ marginTop: 8 }}><Btn variant="secondary" type="button" onClick={cancelInvForm}>Cancel</Btn><Btn variant="success" type="button" icon="fas fa-save" onClick={saveInvProduct}>Save & Scan Next</Btn></div>
        </div>
      ) : (
        <div className="form-group" style={{ marginTop: 14 }}><label><i className="fas fa-keyboard" /> Or enter barcode manually</label><input value={manual} onChange={e => setManual(e.target.value)} placeholder="Type barcode then press Enter or Submit" onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); handleManual(); } }} /></div>
      )}
      <div className="form-actions" style={{ justifyContent: 'space-between' }}>
        <Btn variant="secondary" type="button" onClick={() => { stopScanner(); onClose(); }}>Close</Btn>
        {!invForm ? <Btn type="button" onClick={handleManual} disabled={!manual.trim()}>Submit</Btn> : null}
      </div>
    </Modal>
  );
}

/* Reports */
function ReportsPage() {
  const { session, getPermissions } = useApp();

  const exps = getTenantData(tid, 'expenses', []).filter(e => !isB || e.store === session.user.store);
  const rev = sales.reduce((s, x) => s + (Number(x.totalPrice) || 0), 0);
  const cogs = sales.reduce((s, x) => s + (Number(x.totalCost) || 0), 0);
  const exp = exps.reduce((s, x) => s + (Number(x.amount) || 0), 0);
  const profit = rev - cogs - exp;
  const [sendOpen, setSendOpen] = useState(false); const [reportType, setReportType] = useState('sales'); const [waNum, setWaNum] = useState(''); const [emailAddr, setEmailAddr] = useState('');
  const buildMessage = (type) => { const tn = getTenant(tid); const cN = tn ? tn.companyName : 'Company'; const lines = []; if (type === 'sales') { lines.push('*SALES REPORT*', '━━━━━━━━━━━━━━━━━━', '🏢 *' + cN + '*', '🕐 ' + fmtDateTime(Date.now()), ''); lines.push('💰 Revenue: ' + fmtMoney(rev), '📊 COGS: ' + fmtMoney(cogs)); if (perms.seeExpenses) lines.push('🧾 Expenses: ' + fmtMoney(exp)); if (perms.seeNetProfit) lines.push('📈 *NET PROFIT: ' + fmtMoney(profit) + '*'); lines.push('', '*Recent Sales:*'); sales.slice().sort((a, b) => b.date - a.date).slice(0, 10).forEach((s, i) => { lines.push((i+1) + '. ' + (s.customer || 'Cash') + ' — ' + fmtMoney(s.totalPrice)); }); } else { const debts = sales.filter(s => s.paid === false).sort((a, b) => b.date - a.date); const total = debts.reduce((s, x) => s + (Number(x.totalPrice) || 0), 0); lines.push('*DEBTS REPORT*', '━━━━━━━━━━━━━━━━━━', '🏢 *' + cN + '*', '🕐 ' + fmtDateTime(Date.now()), ''); lines.push('💰 *Total: ' + fmtMoney(total) + '*', '👥 Count: ' + debts.length, '', '*Debtors:*'); debts.slice(0, 20).forEach((d, i) => { lines.push((i+1) + '. ' + (d.customer || '?') + ' — ' + fmtMoney(d.totalPrice)); }); } lines.push('', '_MeX PRO_'); return lines.join('\n'); };
  const sendWhatsApp = () => { const n = normalizeWaNumber(waNum); if (!n) return toast('Enter WhatsApp', 'error'); window.open('https://wa.me/' + n + '?text=' + encodeURIComponent(buildMessage(reportType)), '_blank'); setSendOpen(false); toast('✅ Opened', 'success'); };
  const sendEmail = () => { if (!emailAddr) return toast('Enter email', 'error'); const subj = reportType === 'sales' ? 'Sales Report' : 'Debts Report'; window.location.href = 'mailto:' + encodeURIComponent(emailAddr) + '?subject=' + encodeURIComponent(subj) + '&body=' + encodeURIComponent(buildMessage(reportType)); setSendOpen(false); toast('✅ Opened', 'success'); };
  const openSend = (type) => { setReportType(type); setSendOpen(true); };
  return (
    <div>
      <div className="section-header"><h2><i className="fas fa-file-alt" /> Reports</h2></div>
      <div className="stats-grid">
        <div className="stat-card"><div className="stat-label">Sales</div><div className="stat-value primary">{fmtMoney(rev)}</div></div>
        {perms.seeExpenses ? <div className="stat-card"><div className="stat-label">Expenses</div><div className="stat-value red">{fmtMoney(exp)}</div></div> : null}
        {perms.seeNetProfit ? <div className="stat-card"><div className="stat-label">Net Profit</div><div className={'stat-value ' + (profit >= 0 ? 'primary' : 'red')}>{fmtMoney(profit)}</div></div> : null}
        <div className="stat-card"><div className="stat-label">Transactions</div><div className="stat-value primary">{sales.length}</div></div>
      </div>
      <Card><div className="card-header"><h3>Send Reports</h3></div><div className="card-body"><div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
        <Btn variant="whatsapp" icon="fab fa-whatsapp" onClick={() => openSend('sales')}>Sales WhatsApp</Btn>
        <Btn variant="email" icon="fas fa-envelope" onClick={() => openSend('sales')}>Sales Email</Btn>
        <Btn variant="whatsapp" icon="fab fa-whatsapp" onClick={() => openSend('debts')} style={{ background: '#0e6b5f' }}>Debts WhatsApp</Btn>
        <Btn variant="email" icon="fas fa-envelope" onClick={() => openSend('debts')}>Debts Email</Btn>
      </div></div></Card>
      <Modal open={sendOpen} onClose={() => setSendOpen(false)} title={'Send ' + (reportType === 'sales' ? 'Sales' : 'Debts') + ' Report'} icon="fas fa-paper-plane" maxWidth={520}>
        <div className="form-group"><label><i className="fab fa-whatsapp" style={{ color: '#25D366' }} /> WhatsApp</label><input type="tel" value={waNum} onChange={e => setWaNum(e.target.value)} placeholder="+255 xxx xxx xxx" /></div>
        <div className="form-group"><label><i className="fas fa-envelope" style={{ color: '#3b82f6' }} /> Email</label><input type="email" value={emailAddr} onChange={e => setEmailAddr(e.target.value)} placeholder="example@email.com" /></div>

        <div className="form-actions"><Btn variant="secondary" onClick={() => setSendOpen(false)}>Cancel</Btn></div>
      </Modal>
    </div>
  );
}

function CompaniesTab({ session }) {
  const [tenants, setTenants] = useState(getAllTenants());
  const [viewProfile, setViewProfile] = useState(null);
  const myKey = getLikeKey(session);
  useEffect(() => { setTenants(getAllTenants()); }, []);
  const companies = tenants.filter(t => !t.blocked && !t.pendingApproval && t.id !== session.tenantId);
  if (companies.length === 0) return <Card><div className="card-body"><div className="empty-state"><i className="fas fa-users" /><h3>No companies</h3></div></div></Card>;
  return (
    <div>
      {companies.map(tn => {
        const owner = getTenantData(tn.id, 'users', []).find(u => u.role === 'owner');
        const theirKey = owner ? getUserKey('tenant', owner.id, tn.id) : null;
        const iFollow = theirKey ? isFollowing(myKey, theirKey) : false;
        return (
          <Card key={tn.id} className="mb-16">
            <div className="card-body" style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
              <img src={avatarUrl(tn.companyName)} alt="" style={{ width: 50, height: 50, borderRadius: '50%', objectFit: 'cover', border: '2px solid var(--accent-1)', cursor: 'pointer' }} onClick={() => owner && setViewProfile({ userType: 'tenant', userId: owner.id, tenantId: tn.id })} />
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontWeight: 700, fontSize: '.95rem', display: 'flex', alignItems: 'center', gap: 5, cursor: 'pointer' }} onClick={() => owner && setViewProfile({ userType: 'tenant', userId: owner.id, tenantId: tn.id })}>{tn.companyName} <span className="verified-badge"><i className="fas fa-check" /></span></div>
                <div style={{ fontSize: '.72rem', color: 'var(--text-muted)', marginTop: 2 }}>Since {fmtDate(tn.createdAt)}</div>
              </div>
              {owner && theirKey && theirKey !== myKey ? (
                <button className={iFollow ? 'profile-btn-following' : 'profile-btn-follow'} style={{ padding: '6px 14px', fontSize: '.78rem', minWidth: 'auto', flex: 'none' }} onClick={() => { if (iFollow) unfollowUser(myKey, theirKey); else followUser(myKey, theirKey); window.dispatchEvent(new Event('follows-changed')); }}>
                  {iFollow ? 'Following' : 'Follow'}
                </button>
              ) : null}
            </div>
          </Card>
        );
      })}
      {viewProfile && <UserProfileViewModal userType={viewProfile.userType} userId={viewProfile.userId} tenantId={viewProfile.tenantId} session={session} onClose={() => setViewProfile(null)} />}
    </div>
  );
}

function CompanyStatusTab({ session }) {
  const toast = useToast();
  const { refresh } = useApp();
  const tid = session.tenantId;
  const [statuses, setStatuses] = useState(getTenantData(tid, 'statuses', []));
  const [open, setOpen] = useState(false); const [text, setText] = useState(''); const [commentInputs, setCommentInputs] = useState({});
  useEffect(() => { setStatuses(getTenantData(tid, 'statuses', [])); }, [tid]);
  const post = (e) => { e.preventDefault(); if (!text.trim()) return; const newS = { id: uid(), userId: session.user.id, userName: session.user.fullName || session.user.username, text: text.trim(), timestamp: Date.now(), likes: [], comments: [] }; const updated = [newS].concat(statuses); setTenantData(tid, 'statuses', updated); setStatuses(updated); setOpen(false); setText(''); refresh(); toast('✅ Posted', 'success'); };
  const like = (id) => { const updated = statuses.map(s => { if (s.id !== id) return s; const likes = s.likes || []; const idx = likes.indexOf(session.user.id); return Object.assign({}, s, { likes: idx >= 0 ? likes.filter(l => l !== session.user.id) : likes.concat([session.user.id]) }); }); setTenantData(tid, 'statuses', updated); setStatuses(updated); };
  const addComment = (id) => { const txt = (commentInputs[id] || '').trim(); if (!txt) return; const updated = statuses.map(s => s.id === id ? Object.assign({}, s, { comments: (s.comments || []).concat([{ id: uid(), userId: session.user.id, userName: session.user.fullName || session.user.username, text: txt, timestamp: Date.now() }]) }) : s); setTenantData(tid, 'statuses', updated); setStatuses(updated); setCommentInputs(Object.assign({}, commentInputs, { [id]: '' })); };
  const del = (id) => { if (!confirm('Delete?')) return; const updated = statuses.filter(s => s.id !== id); setTenantData(tid, 'statuses', updated); setStatuses(updated); toast('Deleted', 'warning'); };
  return (
    <div>
      <div className="section-header"><h2><i className="fas fa-pen" /> Company Status</h2><Btn icon="fas fa-plus" onClick={() => setOpen(true)}>Post Status</Btn></div>
      {statuses.length === 0 ? <Card><div className="card-body"><div className="empty-state"><i className="fas fa-pen" /><h3>No statuses</h3></div></div></Card> : null}
      {statuses.map(s => { const liked = (s.likes || []).indexOf(session.user.id) >= 0; const comments = s.comments || []; const isOwn = s.userId === session.user.id; return (
        <div key={s.id} className="status-card">
          <div className="status-header"><img className="status-avatar" src={avatarUrl(s.userName)} alt="" /><div className="status-meta"><div className="status-name">{s.userName} <span className="verified-badge"><i className="fas fa-check" /></span></div><div className="status-time">{fmtDateTime(s.timestamp)}</div></div>{isOwn ? <Btn variant="danger" size="xs" icon="fas fa-trash" onClick={() => del(s.id)} /> : null}</div>
          <p className="status-text">{s.text}</p>
          <div className="status-actions"><button className={'btn btn-sm ' + (liked ? 'btn-primary' : 'btn-secondary')} onClick={() => like(s.id)}><i className="fas fa-heart" /> {(s.likes || []).length}</button><span style={{ fontSize: '.85rem', color: 'var(--text-muted)' }}><i className="fas fa-comment" /> {comments.length}</span></div>
          {comments.length > 0 ? <div style={{ marginTop: 8 }}>{comments.map(c => (<div key={c.id} className="comment-item"><img className="comment-avatar" src={avatarUrl(c.userName)} alt="" /><div className="comment-body"><span className="comment-author">{c.userName}</span><span>{c.text}</span><span className="comment-time">{fmtRelative(c.timestamp)}</span></div></div>))}</div> : null}
          <div style={{ display: 'flex', gap: 8, marginTop: 8 }}><input value={commentInputs[s.id] || ''} onChange={e => setCommentInputs(Object.assign({}, commentInputs, { [s.id]: e.target.value }))} onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); addComment(s.id); } }} placeholder="Add comment..." style={{ flex: 1 }} /><Btn size="sm" onClick={() => addComment(s.id)}>Send</Btn></div>
        </div>
      ); })}
      <Modal open={open} onClose={() => setOpen(false)} title="Post Status" icon="fas fa-pen">
        <form onSubmit={post}><div className="form-group"><label>What's on your mind?</label><textarea rows="5" value={text} onChange={e => setText(e.target.value)} maxLength={800} required /></div><div className="form-actions"><Btn variant="secondary" type="button" onClick={() => setOpen(false)}>Cancel</Btn><Btn type="submit">Post</Btn></div></form>
      </Modal>
    </div>
  );
}
